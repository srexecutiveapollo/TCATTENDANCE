<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apollo Home Care — Attendance Map</title>
<meta name="theme-color" content="#1F5940">
<style>
  :root{
    --ink:#141C2B; --paper:#EEF2F1; --card:#FFFFFF;
    --pulse:#2F7A5C; --pulse-deep:#1B4C37; --pulse-soft:#EAF3EF;
    --line:#D8E0DD; --muted:#6A7A82; --danger:#B23A2E;
    --danger-soft:#FBEAE7; --radius:16px; --radius-sm:10px;
    --green:#2F7A5C; --green-bright:#3DCB82; --red:#D14A3C;
    --font-mono:ui-monospace,'SF Mono','Roboto Mono','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5; background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column; min-height:100vh;
  }

  /* ── Toolbar ─────────────────────── */
  .toolbar{
    background:linear-gradient(135deg,var(--pulse-deep),var(--pulse));
    color:#fff; padding:12px 20px; display:flex; align-items:center;
    gap:14px; flex-wrap:wrap; flex-shrink:0;
    box-shadow:0 2px 12px rgba(27,76,55,0.25); z-index:10;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand img.logo{
    height:42px; width:auto; min-width:42px; border-radius:8px; background:#fff; padding:3px;
    object-fit:contain;
  }
  .brand .divider{ width:1px; height:32px; background:rgba(255,255,255,0.35); }
  .brand h1{ margin:0; font-size:17px; font-weight:700; letter-spacing:-0.015em; line-height:1.15; }
  .brand .sub{ font-size:11.5px; opacity:0.85; font-family:var(--font-mono); }
  .toolbar .spacer{ flex:1; }
  .filters{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; }
  .filters label{
    font-size:11px; font-weight:700; opacity:0.9; letter-spacing:0.05em;
    text-transform:uppercase; display:flex; flex-direction:column; gap:4px;
  }
  .filters input, .filters select{
    padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.3);
    background:rgba(255,255,255,0.15); color:#fff; font-size:13px;
    font-family:var(--font-mono); min-height:36px;
  }
  .filters input::placeholder{ color:rgba(255,255,255,0.65); }
  .filters select option{ color:var(--ink); background:#fff; }
  .filters input[type=date]::-webkit-calendar-picker-indicator{ filter:invert(1); cursor:pointer; }
  .toolbar button{
    padding:9px 18px; border:none; border-radius:9px; background:#fff;
    color:var(--pulse-deep); font-weight:700; font-size:13.5px; cursor:pointer;
    transition:transform .1s, filter .15s; min-height:36px;
  }
  .toolbar button:hover{ filter:brightness(0.95); }

  /* ── Layout ──────────────────────── */
  .main{ flex:1; display:flex; min-height:0; }
  #map{ flex:1; min-height:400px; background:#dde5e2; }
  .sidebar{
    width:380px; flex-shrink:0; background:var(--card);
    border-left:1px solid var(--line); display:flex; flex-direction:column;
    overflow:hidden; position:relative;
  }
  .sidebar-header{
    padding:12px 18px; border-bottom:1px solid var(--line);
    font-size:12px; font-weight:700; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--pulse-deep);
    display:flex; justify-content:space-between; align-items:center;
    flex-shrink:0;
  }
  .sidebar-header .count{
    background:var(--pulse-soft); color:var(--pulse-deep);
    padding:2px 10px; border-radius:20px; font-size:11px;
    font-family:var(--font-mono); letter-spacing:0;
  }
  .list{ flex:1; overflow-y:auto; padding:8px; }
  .list::-webkit-scrollbar{ width:6px; }
  .list::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }

  .item{
    display:flex; gap:11px; padding:11px 10px; border-radius:12px;
    cursor:pointer; transition:background .15s; align-items:flex-start;
    border:1px solid transparent;
  }
  .item:hover{ background:#F6F9F8; border-color:var(--line); }
  .item.active{ background:var(--pulse-soft); border-color:#BFDBCF; }
  .item img.thumb{
    width:52px; height:52px; border-radius:9px; object-fit:cover;
    flex-shrink:0; border:1px solid var(--line); background:#eee;
    cursor:zoom-in;
  }
  .item .thumb.no-photo{
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:#fff;
    background:linear-gradient(135deg,var(--pulse-deep),var(--pulse));
    font-size:16px;
  }
  .item .info{ flex:1; min-width:0; }
  /* Name row: name + staff type side-by-side */
  .item .name-row{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    line-height:1.3;
  }
  .item .name{
    font-weight:700; font-size:13.5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:100%;
  }
  .item .staff-type{
    font-size:9.5px; font-weight:800; padding:1px 7px; border-radius:20px;
    letter-spacing:0.05em; text-transform:uppercase;
    background:#F0F1F4; color:#4A5568; flex-shrink:0;
  }
  .item .staff-type.onroll{ background:#E6F0EA; color:#1B4C37; }
  .item .staff-type.aen   { background:#EDE9F7; color:#4B3B7A; }
  .item .staff-type.agency{ background:#FDF3E0; color:#8A5A1F; }
  .item .meta{
    font-size:11.5px; color:var(--muted); margin-top:2px;
    font-family:var(--font-mono);
  }
  .item .patient{
    font-size:12px; color:var(--ink-soft); margin-top:3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .item .times{ margin-top:6px; display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
  .pill{
    display:inline-flex; align-items:center; gap:4px;
    font-size:10.5px; font-weight:700; padding:2px 8px;
    border-radius:20px; letter-spacing:0.02em;
    font-family:var(--font-mono);
  }
  .pill.in{ background:#E6F0EA; color:#1B4C37; }
  .pill.out{ background:#E8EEF6; color:#2E4A6E; }
  .pill.dur{ background:#FDF3E0; color:#8A5A1F; }
  .pill.dist{ background:#EDE9F7; color:#4B3B7A; }
  .pill.miss{ background:var(--danger-soft); color:var(--danger); }
  .pill.date{ background:#F0F1F4; color:#4A5568; }

  /* ── Detail view (inside sidebar) ─ */
  .detail-view{
    position:absolute; inset:0; background:#fff;
    display:flex; flex-direction:column;
    transform:translateX(100%); transition:transform .28s ease;
    z-index:5;
  }
  .detail-view.open{ transform:translateX(0); }
  .detail-head{
    display:flex; align-items:center; gap:10px;
    padding:12px 14px; border-bottom:1px solid var(--line);
    flex-shrink:0; background:linear-gradient(135deg,#F3F8F5,#EAF3EF);
  }
  .back-btn{
    display:flex; align-items:center; gap:6px;
    background:#fff; border:1px solid var(--line); border-radius:9px;
    padding:7px 12px; font-size:12.5px; font-weight:700;
    color:var(--pulse-deep); cursor:pointer; font-family:inherit;
    flex-shrink:0;
  }
  .back-btn:hover{ background:#F6F9F8; }
  .back-btn svg{ width:14px; height:14px; }
  .detail-head .title{
    font-size:13px; font-weight:700; color:var(--pulse-deep);
    letter-spacing:0.06em; text-transform:uppercase;
  }
  .detail-body{ flex:1; overflow-y:auto; padding:16px; }
  .detail-body::-webkit-scrollbar{ width:6px; }
  .detail-body::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }

  .d-profile{ display:flex; gap:14px; align-items:center; margin-bottom:18px; }
  .d-profile img{
    width:80px; height:80px; border-radius:12px; object-fit:cover;
    border:1px solid var(--line); flex-shrink:0; background:#eee; cursor:zoom-in;
  }
  .d-profile .avatar{
    width:80px; height:80px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--pulse-deep),var(--pulse));
    color:#fff; font-weight:700; font-size:26px; flex-shrink:0;
  }
  .d-profile .d-name-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .d-profile h2{ margin:0; font-size:17px; font-weight:700; line-height:1.25; }
  .d-profile .d-sub{ font-size:12px; color:var(--muted); margin-top:3px; font-family:var(--font-mono); }

  .d-section{
    background:#F6F9F8; border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; margin-bottom:14px;
  }
  .d-section h3{
    margin:0 0 10px; font-size:11px; font-weight:800;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--pulse-deep);
    display:flex; align-items:center; gap:6px;
  }
  .d-section h3 .dot{
    width:8px; height:8px; border-radius:50%;
  }
  .d-section h3 .dot.in{ background:var(--green-bright); box-shadow:0 0 0 3px rgba(61,203,130,0.25); }
  .d-section h3 .dot.out{ background:var(--green); }
  .d-section h3 .dot.miss{ background:var(--red); }

  .d-row{
    display:flex; justify-content:space-between; gap:12px;
    padding:7px 0; font-size:13px;
    border-bottom:1px dashed #E7ECEA;
  }
  .d-row:last-child{ border-bottom:none; }
  .d-row .k{ color:var(--muted); font-weight:600; flex-shrink:0; }
  .d-row .v{ text-align:right; word-break:break-word; font-family:var(--font-mono); font-size:12px; }
  .d-row .v a{ color:var(--pulse-deep); font-weight:700; }

  .distance-banner{
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(135deg,#EDE9F7,#E2DBF0);
    border:1px solid #C9BEE0; border-radius:12px;
    padding:12px 16px; margin-bottom:14px;
  }
  .distance-banner .label{
    font-size:11px; font-weight:800; letter-spacing:0.08em;
    text-transform:uppercase; color:#4B3B7A;
  }
  .distance-banner .value{
    font-size:18px; font-weight:800; color:#4B3B7A;
    font-family:var(--font-mono); letter-spacing:-0.01em;
  }

  /* ── States ─────────────────────── */
  .state-msg{ padding:40px 24px; text-align:center; color:var(--muted); font-size:14px; }
  .state-msg b{ color:var(--ink); display:block; font-size:15px; margin-bottom:6px; }
  .spinner{
    width:32px; height:32px; border-radius:50%; border:3px solid var(--line);
    border-top-color:var(--pulse); margin:0 auto 16px; animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .errmsg{
    font-size:13px; color:var(--danger); padding:12px 16px;
    background:var(--danger-soft); border:1px solid #E3B4AB;
    border-radius:9px; margin:12px; line-height:1.6;
  }
  .errmsg code{ background:rgba(0,0,0,0.06); padding:1px 5px; border-radius:4px; font-size:12px; }

  /* ── Map markers ───────────────── */
  .map-pin{
    width:46px; height:46px; border-radius:50%; overflow:hidden;
    border:3px solid #fff; box-shadow:0 3px 10px rgba(20,28,43,0.4);
    background:#ddd; cursor:pointer; transition:transform .15s;
    position:relative;
  }
  .map-pin:hover{ transform:scale(1.1); }
  .map-pin img{ width:100%; height:100%; object-fit:cover; display:block; }
  .map-pin.no-photo{
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:#fff;
    background:linear-gradient(135deg,var(--pulse-deep),var(--pulse));
    font-size:15px;
  }

  /* Signed in — open: green ring + blinking */
  .map-pin.state-in{
    border-color:var(--green-bright);
    animation:blinkGreen 1.4s ease-in-out infinite;
  }
  @keyframes blinkGreen{
    0%,100%{ box-shadow:0 0 0 0 rgba(61,203,130,0.55), 0 3px 10px rgba(20,28,43,0.4); }
    50%    { box-shadow:0 0 0 10px rgba(61,203,130,0),   0 3px 10px rgba(20,28,43,0.4); }
  }
  /* Signed out: solid green ring */
  .map-pin.state-out{ border-color:var(--green); }
  /* Missing sign-out: red ring */
  .map-pin.state-miss{ border-color:var(--red); }

  .map-pin.selected{ transform:scale(1.15); z-index:999; }

  /* Smaller secondary markers for sign-in/out when row selected */
  .map-pin.mini{
    width:30px; height:30px; border-width:2px;
  }
  .map-pin.mini.no-photo{ font-size:10px; }

  .leaflet-tooltip.dist-tip{
    background:#4B3B7A; color:#fff; border:none;
    font-family:var(--font-mono); font-size:11px; font-weight:700;
    padding:4px 9px; border-radius:20px;
    box-shadow:0 3px 10px rgba(75,59,122,0.4);
  }
  .leaflet-tooltip.dist-tip::before{ border-top-color:#4B3B7A; }

  /* ── Lightbox ─────────────────── */
  .lightbox{
    position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,0.9);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,0.5); }
  .lightbox .close-lb{
    position:absolute; top:20px; right:24px; background:none; border:none;
    color:#fff; font-size:36px; cursor:pointer; line-height:1;
  }

  @media (max-width:900px){
    .toolbar{ padding:10px 14px; gap:10px; }
    .brand h1{ font-size:15px; }
    .brand img.logo{ height:36px; min-width:36px; }
    .filters{ width:100%; }
    .filters label{ flex:1; min-width:120px; }
    .filters input, .filters select{ width:100%; }
  }
  @media (max-width:760px){
    .main{ flex-direction:column; }
    #map{ min-height:260px; flex:0 0 42vh; }
    .sidebar{ width:100%; flex:1; border-left:none; border-top:1px solid var(--line); }
    .detail-view{ border-radius:0; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="brand">
    <img class="logo" id="brandLogo" src="" alt="Apollo Home Care">
    <div class="divider"></div>
    <div>
      <h1>Attendance Map</h1>
      <div class="sub">Apollo Home Care — Nurses Daily Attendance</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="filters">
    <label>From <input type="date" id="dateFrom"></label>
    <label>To <input type="date" id="dateTo"></label>
    <label>
      Staff Type
      <select id="staffTypeFilter" translate="no">
        <option value="">All types</option>
        <option value="Onroll">Onroll</option>
        <option value="AEN">AEN</option>
        <option value="Agency">Agency</option>
      </select>
    </label>
    <label>
      Status
      <select id="statusFilter" translate="no">
        <option value="">All</option>
        <option value="in">Signed in (open)</option>
        <option value="out">Signed out</option>
        <option value="missing">Missing sign-out</option>
      </select>
    </label>
    <label>Employee ID <input type="text" id="empIdSearch" placeholder="Search ID…" autocomplete="off" translate="no"></label>
    <button type="button" id="refreshBtn">Refresh</button>
  </div>
</div>

<div class="main">
  <div id="map"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>Punches</span>
      <span class="count" id="punchCount">—</span>
    </div>
    <div class="list" id="list">
      <div class="state-msg"><div class="spinner"></div>Loading attendance…</div>
    </div>

    <!-- Detail panel slides in from right inside the sidebar -->
    <div class="detail-view" id="detailView">
      <div class="detail-head">
        <button type="button" class="back-btn" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>
        <span class="title">Attendance Detail</span>
      </div>
      <div class="detail-body" id="detailBody"></div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button type="button" class="close-lb" id="closeLightbox" aria-label="Close">&times;</button>
  <img id="lightboxImg" alt="Full photo">
</div>

<script>
  /* ============================================================
     CONFIG
     ============================================================ */
  const SUPABASE_URL      = 'https://pdgxpgvwgnptxdvffgos.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkZ3hwZ3Z3Z25wdHhkdmZmZ29zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwODE4NzQsImV4cCI6MjEwODY1Nzg3NH0.MT7IQIbwfLumBoUQ3PaXipoJti14z10rz8NBzqMMASo';

  const TABLE = 'attendance';

  /* Logo — same folder as this HTML */
  const LOGO_URL = 'logo.png';

  /* Optional: set if you want to force a date column. Blank = auto-detect. */
  const DATE_COLUMN_OVERRIDE = '';
  const DATE_COLUMN_CANDIDATES = ['duty_date', 'date', 'sign_in_at', 'created_at', 'timestamp'];

  /* ============================================================
     State
     ============================================================ */
  let map = null;
  let markers = [];
  let selectedOverlay = [];   // extra markers + polyline for selected row
  let allRows = [];
  let filteredRows = [];
  let mapReady = false;
  let selectedId = null;
  let L = null;
  let detectedDateColumn = null;

  const dateFrom        = document.getElementById('dateFrom');
  const dateTo          = document.getElementById('dateTo');
  const staffTypeFilter = document.getElementById('staffTypeFilter');
  const statusFilter    = document.getElementById('statusFilter');
  const empIdSearch     = document.getElementById('empIdSearch');
  const refreshBtn      = document.getElementById('refreshBtn');
  const listEl          = document.getElementById('list');
  const punchCountEl    = document.getElementById('punchCount');
  const detailView      = document.getElementById('detailView');
  const detailBody      = document.getElementById('detailBody');
  const backBtn         = document.getElementById('backBtn');
  const lightbox        = document.getElementById('lightbox');
  const lightboxImg     = document.getElementById('lightboxImg');
  const closeLightbox   = document.getElementById('closeLightbox');
  const brandLogo       = document.getElementById('brandLogo');

  /* ── Logo ── */
  brandLogo.src = LOGO_URL;
  brandLogo.onerror = () => { brandLogo.style.display = 'none'; };

  function localDateStr(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  const todayStr = localDateStr(new Date());
  dateFrom.value = todayStr;
  dateTo.value   = todayStr;

  /* ============================================================
     Helpers
     ============================================================ */
  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => (
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
    ));
  }
  function fmtTime(iso){
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  }
  function fmtDateTime(iso){
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }) +
      ' ' + d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  }
  function fmtDateShort(iso){
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short' });
  }
  function fmtDuration(ms){
    if (!isFinite(ms) || ms < 0) return '—';
    const totalMin = Math.round(ms / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return (h > 0 ? h + 'h ' : '') + m + 'm';
  }
  function initials(name){
    return String(name || '?').trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
  }
  function rowId(row){ return String(row.submission_id || row.id || row.employee_id || ''); }
  function durationOf(row){
    if (!row.sign_in_at || !row.sign_out_at) return null;
    const ms = new Date(row.sign_out_at).getTime() - new Date(row.sign_in_at).getTime();
    return isFinite(ms) && ms >= 0 ? ms : null;
  }

  /* Haversine distance in meters */
  function haversineMeters(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const φ1 = toRad(lat1), φ2 = toRad(lat2);
    const Δφ = toRad(lat2 - lat1);
    const Δλ = toRad(lon2 - lon1);
    const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function fmtDistance(m){
    if (m == null || !isFinite(m)) return null;
    if (m < 1000) return Math.round(m) + ' m';
    return (m / 1000).toFixed(m < 10000 ? 2 : 1) + ' km';
  }
  /* Distance between sign-in and sign-out locations of a row (null if sign-out missing or coords missing) */
  function rowDistance(row){
    if (row.sign_out_at == null) return null;
    /* Sign-out coords — try several common column name patterns */
    const outLat = row.sign_out_latitude ?? row.signout_latitude ?? row.out_latitude ?? row.latitude_out ?? null;
    const outLng = row.sign_out_longitude ?? row.signout_longitude ?? row.out_longitude ?? row.longitude_out ?? null;
    if (outLat == null || outLng == null) return null;
    if (row.latitude == null || row.longitude == null) return null;
    return haversineMeters(
      Number(row.latitude), Number(row.longitude),
      Number(outLat), Number(outLng)
    );
  }
  /* Sign-out coords for selected row */
  function outCoordsOf(row){
    const outLat = row.sign_out_latitude ?? row.signout_latitude ?? row.out_latitude ?? row.latitude_out ?? null;
    const outLng = row.sign_out_longitude ?? row.signout_longitude ?? row.out_longitude ?? row.longitude_out ?? null;
    if (outLat == null || outLng == null) return null;
    return { lat: Number(outLat), lng: Number(outLng) };
  }
  function statusOf(row){
    if (!row.sign_out_at) return 'in';
    return 'out';
  }
  function statusClass(row){
    /* Per user spec: signed in = green blinking, signed out = full green, missed sign-out = red.
       "Missed sign-out" = shift where sign_out_at is null. But note: this overlaps with "signed in (open)".
       We treat: sign_out_at present = signed out (green), null = missed/red. To also show "in-progress blink"
       when sign_in is today and no sign_out yet, we mark those with state-in. */
    if (!row.sign_out_at) {
      /* Is this "currently signed in" or "missed sign-out"? Differentiate by date:
         if sign_in is today → open (blinking green); else → missed (red). */
      const signInDay = row.sign_in_at ? localDateStr(new Date(row.sign_in_at)) : null;
      const today = localDateStr(new Date());
      return signInDay === today ? 'in' : 'miss';
    }
    return 'out';
  }

  /* ============================================================
     REST wrapper
     ============================================================ */
  async function restGet(path){
    const res = await fetch(SUPABASE_URL + path, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Accept': 'application/json'
      }
    });
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
    if (!res.ok){
      const msg = (data && (data.message || data.hint || data.error)) || ('HTTP ' + res.status);
      const err = new Error(msg); err.status = res.status; throw err;
    }
    return data;
  }

  async function detectDateColumn(){
    if (DATE_COLUMN_OVERRIDE){ detectedDateColumn = DATE_COLUMN_OVERRIDE; return detectedDateColumn; }
    const probe = await restGet('/rest/v1/' + TABLE + '?select=*&limit=1');
    if (!Array.isArray(probe) || !probe.length) throw new Error('Table is empty.');
    const cols = Object.keys(probe[0]);
    for (const cand of DATE_COLUMN_CANDIDATES){
      if (cols.includes(cand)){ detectedDateColumn = cand; return cand; }
    }
    throw new Error('No usable date column in ' + TABLE);
  }

  async function fetchAttendance(fromStr, toStr){
    if (!detectedDateColumn) await detectDateColumn();
    const col = detectedDateColumn;
    if (col === 'duty_date' || col === 'date'){
      return await restGet('/rest/v1/' + TABLE +
        '?select=*' +
        '&' + col + '=gte.' + encodeURIComponent(fromStr) +
        '&' + col + '=lte.' + encodeURIComponent(toStr) +
        '&order=' + col + '.desc') || [];
    }
    const from = new Date(fromStr + 'T00:00:00'); from.setDate(from.getDate() - 1);
    const to   = new Date(toStr   + 'T23:59:59.999'); to.setDate(to.getDate() + 1);
    const rows = await restGet('/rest/v1/' + TABLE +
      '?select=*' +
      '&' + col + '=gte.' + encodeURIComponent(from.toISOString()) +
      '&' + col + '=lte.' + encodeURIComponent(to.toISOString()) +
      '&order=' + col + '.desc') || [];
    return rows.filter(r => {
      const raw = r[col]; if (!raw) return true;
      const local = localDateStr(new Date(raw));
      return local >= fromStr && local <= toStr;
    });
  }

  /* ============================================================
     Filters
     ============================================================ */
  function applyFilters(){
    const type   = staffTypeFilter.value;
    const status = statusFilter.value;
    const idQ    = empIdSearch.value.trim().toLowerCase();
    filteredRows = allRows.filter(r => {
      if (type && String(r.emp_type || '').toLowerCase() !== type.toLowerCase()) return false;
      if (status === 'in'  && r.sign_out_at) return false;
      if (status === 'out' && !r.sign_out_at) return false;
      if (status === 'missing'){
        if (r.sign_out_at) return false;
        /* Same local-day check as statusClass */
        const day = r.sign_in_at ? localDateStr(new Date(r.sign_in_at)) : null;
        if (day === localDateStr(new Date())) return false;
      }
      if (idQ){
        const hay = (String(r.employee_id || '') + ' ' + String(r.nurse_name || '')).toLowerCase();
        if (!hay.includes(idQ)) return false;
      }
      return true;
    });
    renderList();
    plotAll();
  }

  /* ============================================================
     Map
     ============================================================ */
  function loadScript(src){
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function initMap(){
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(link);
    await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
    L = window.L;
    map = L.map('map', { zoomControl: true }).setView([20.5937, 78.9629], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    mapReady = true;
  }

  function clearMarkers(){
    if (L && map) markers.forEach(m => map.removeLayer(m));
    markers = [];
  }
  function clearSelectedOverlay(){
    if (L && map){
      selectedOverlay.forEach(item => {
        if (item.remove) item.remove();
        else if (map.removeLayer) map.removeLayer(item);
      });
    }
    selectedOverlay = [];
  }

  function plotAll(){
    if (!mapReady || !L) return;
    clearMarkers();
    const withCoords = filteredRows.filter(r =>
      r.latitude != null && r.longitude != null &&
      isFinite(Number(r.latitude)) && isFinite(Number(r.longitude))
    );
    if (!withCoords.length) return;
    withCoords.forEach(row => addMarker(row));
    const bounds = withCoords.map(r => [Number(r.latitude), Number(r.longitude)]);
    if (withCoords.length === 1) map.setView(bounds[0], 13);
    else map.fitBounds(bounds, { padding: [40, 40] });
  }

  function addMarker(row){
    const lat = Number(row.latitude);
    const lng = Number(row.longitude);
    const hasPhoto = !!row.photo_base64;
    const init = initials(row.nurse_name);
    const id = rowId(row);
    const stateClass = 'state-' + statusClass(row);

    const iconHtml = hasPhoto
      ? `<div class="map-pin ${stateClass}" data-id="${escapeHtml(id)}"><img src="${row.photo_base64}" alt=""></div>`
      : `<div class="map-pin no-photo ${stateClass}" data-id="${escapeHtml(id)}">${escapeHtml(init)}</div>`;
    const icon = L.divIcon({ html: iconHtml, className: '', iconSize: [46, 46], iconAnchor: [23, 23] });
    const marker = L.marker([lat, lng], { icon }).addTo(map);
    marker.on('click', () => selectRow(row));
    marker._row = row;
    markers.push(marker);
  }

  /* ============================================================
     Sidebar list
     ============================================================ */
  function renderList(){
    if (!filteredRows.length){
      listEl.innerHTML = '<div class="state-msg"><b>No matching attendance</b>Try a wider date range or clear filters.</div>';
      punchCountEl.textContent = '0';
      return;
    }
    punchCountEl.textContent = String(filteredRows.length);
    const multiDay = dateFrom.value && dateTo.value && dateFrom.value !== dateTo.value;

    listEl.innerHTML = filteredRows.map(row => {
      const id = rowId(row);
      const hasPhoto = !!row.photo_base64;
      const thumb = hasPhoto
        ? `<img class="thumb" src="${row.photo_base64}" alt="" data-photo="${escapeHtml(row.photo_base64)}">`
        : `<div class="thumb no-photo">${escapeHtml(initials(row.nurse_name))}</div>`;
      const durMs = durationOf(row);
      const durStr = durMs != null ? fmtDuration(durMs) : null;
      const distM = rowDistance(row);
      const distStr = distM != null ? fmtDistance(distM) : null;
      const datePill = multiDay ? `<span class="pill date">${escapeHtml(fmtDateShort(row[detectedDateColumn] || row.sign_in_at))}</span>` : '';

      /* Times row */
      const timesHtml =
        `<span class="pill in">IN ${escapeHtml(fmtTime(row.sign_in_at))}</span>` +
        (row.sign_out_at
          ? `<span class="pill out">OUT ${escapeHtml(fmtTime(row.sign_out_at))}</span>`
          : `<span class="pill miss">Missing sign-out</span>`);

      /* Duration + distance pills */
      const metricsHtml =
        (durStr ? `<span class="pill dur">⏱ ${escapeHtml(durStr)}</span>` : '') +
        (distStr ? `<span class="pill dist">📍 ${escapeHtml(distStr)}</span>` : '');

      /* Staff type — beside the name */
      const typeKey = String(row.emp_type || '').toLowerCase();
      const typeBadge = row.emp_type
        ? `<span class="staff-type ${escapeHtml(typeKey)}">${escapeHtml(row.emp_type)}</span>` : '';

      return `
        <div class="item${selectedId === id ? ' active' : ''}" data-id="${escapeHtml(id)}">
          ${thumb}
          <div class="info">
            <div class="name-row">
              <span class="name">${escapeHtml(row.nurse_name || '—')}</span>
              ${typeBadge}
            </div>
            <div class="meta">${escapeHtml(row.employee_id || '')}${row.care_centre ? ' · ' + escapeHtml(row.care_centre) : ''}</div>
            <div class="patient">👤 ${escapeHtml(row.patient_name || 'No patient')}</div>
            <div class="times">${datePill}${timesHtml}${metricsHtml}</div>
          </div>
        </div>`;
    }).join('');

    listEl.querySelectorAll('.item').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.classList.contains('thumb') && e.target.dataset.photo){
          openLightbox(e.target.dataset.photo); return;
        }
        const row = filteredRows.find(r => rowId(r) === el.dataset.id);
        if (row) selectRow(row);
      });
    });
  }

  /* ============================================================
     Selection — detail view slides in inside sidebar
     ============================================================ */
  function selectRow(row){
    selectedId = rowId(row);
    listEl.querySelectorAll('.item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === selectedId);
    });
    /* Highlight marker */
    markers.forEach(m => {
      const pin = m.getElement && m.getElement().querySelector('.map-pin');
      if (pin) pin.classList.toggle('selected', rowId(m._row || {}) === selectedId);
    });

    showDetail(row);
    plotSelectedRoute(row);
  }

  function showDetail(row){
    const hasPhoto = !!row.photo_base64;
    const photoHtml = hasPhoto
      ? `<img src="${row.photo_base64}" alt="Verification photo" data-photo="${escapeHtml(row.photo_base64)}">`
      : `<div class="avatar">${escapeHtml(initials(row.nurse_name))}</div>`;
    const durMs = durationOf(row);
    const durStr = durMs != null ? fmtDuration(durMs) : '—';
    const distM = rowDistance(row);
    const distStr = distM != null ? fmtDistance(distM) : null;

    const inCoords = (row.latitude != null && row.longitude != null)
      ? { lat: Number(row.latitude), lng: Number(row.longitude) } : null;
    const outCoords = outCoordsOf(row);

    const inMapLink = inCoords
      ? `<a href="https://maps.google.com/?q=${inCoords.lat},${inCoords.lng}" target="_blank" rel="noopener">Open ↗</a>`
      : '—';
    const outMapLink = outCoords
      ? `<a href="https://maps.google.com/?q=${outCoords.lat},${outCoords.lng}" target="_blank" rel="noopener">Open ↗</a>`
      : '—';

    const typeKey = String(row.emp_type || '').toLowerCase();
    const typeBadge = row.emp_type
      ? `<span class="staff-type ${escapeHtml(typeKey)}" style="font-size:10px;padding:2px 9px;">${escapeHtml(row.emp_type)}</span>`
      : '';

    const stClass = statusClass(row);
    const stLabel = stClass === 'in' ? 'Signed in (open)' : stClass === 'out' ? 'Signed out' : 'Missing sign-out';

    detailBody.innerHTML = `
      <div class="d-profile">
        ${photoHtml}
        <div>
          <div class="d-name-row">
            <h2>${escapeHtml(row.nurse_name || '—')}</h2>
            ${typeBadge}
          </div>
          <div class="d-sub">${escapeHtml(row.employee_id || '')} · ${escapeHtml(row.care_centre || '')}</div>
          <div class="d-sub" style="margin-top:4px;color:${stClass==='miss'?'var(--red)':stClass==='in'?'var(--green-bright)':'var(--green)'};font-weight:700;">● ${escapeHtml(stLabel)}</div>
        </div>
      </div>

      <div class="d-section">
        <h3><span class="dot in"></span>Sign-In</h3>
        <div class="d-row"><span class="k">Time</span><span class="v">${escapeHtml(fmtDateTime(row.sign_in_at))}</span></div>
        <div class="d-row"><span class="k">Location</span><span class="v">${escapeHtml(row.location_text || '—')}</span></div>
        <div class="d-row"><span class="k">Coordinates</span><span class="v">${inCoords ? inCoords.lat.toFixed(5) + ', ' + inCoords.lng.toFixed(5) : '—'} ${inMapLink}</span></div>
        <div class="d-row"><span class="k">Accuracy</span><span class="v">${row.accuracy_meters != null ? escapeHtml(row.accuracy_meters) + ' m' : '—'}</span></div>
      </div>

      <div class="d-section">
        <h3><span class="dot ${row.sign_out_at ? 'out' : 'miss'}"></span>Sign-Out</h3>
        ${row.sign_out_at ? `
          <div class="d-row"><span class="k">Time</span><span class="v">${escapeHtml(fmtDateTime(row.sign_out_at))}</span></div>
          <div class="d-row"><span class="k">Coordinates</span><span class="v">${outCoords ? outCoords.lat.toFixed(5) + ', ' + outCoords.lng.toFixed(5) : 'Not recorded'} ${outMapLink}</span></div>
        ` : `
          <div class="d-row"><span class="k">Status</span><span class="v" style="color:var(--red);font-weight:700;">Not signed out</span></div>
        `}
      </div>

      ${distStr ? `
        <div class="distance-banner">
          <span class="label">Distance</span>
          <span class="value">${escapeHtml(distStr)}</span>
        </div>
      ` : ''}

      <div class="d-section">
        <h3>Shift Summary</h3>
        <div class="d-row"><span class="k">Patient</span><span class="v">${escapeHtml(row.patient_name || '—')}</span></div>
        <div class="d-row"><span class="k">Duration</span><span class="v">${escapeHtml(durStr)}</span></div>
        <div class="d-row"><span class="k">Remarks</span><span class="v">${escapeHtml(row.remarks || '—')}</span></div>
      </div>
    `;

    const img = detailBody.querySelector('img[data-photo]');
    if (img) img.addEventListener('click', () => openLightbox(img.dataset.photo));

    detailView.classList.add('open');
  }

  function closeDetailView(){
    detailView.classList.remove('open');
    selectedId = null;
    listEl.querySelectorAll('.item.active').forEach(el => el.classList.remove('active'));
    markers.forEach(m => {
      const pin = m.getElement && m.getElement().querySelector('.map-pin');
      if (pin) pin.classList.remove('selected');
    });
    clearSelectedOverlay();
    plotAll();  // reset view to all rows
  }
  backBtn.addEventListener('click', closeDetailView);

  /* Plot sign-in + sign-out locations of the selected row with a dashed line */
  function plotSelectedRoute(row){
    if (!mapReady || !L) return;
    clearSelectedOverlay();

    const inLat = row.latitude != null ? Number(row.latitude) : null;
    const inLng = row.longitude != null ? Number(row.longitude) : null;
    const outCoords = outCoordsOf(row);
    if (inLat == null || inLng == null) return;

    /* Small green mini pin for sign-in */
    const inPinHtml = `<div class="map-pin mini state-in" style="border-color:var(--green-bright);animation:none;"><img src="${row.photo_base64||''}" alt=""></div>`;
    const inPinHtmlNoPhoto = `<div class="map-pin mini no-photo state-in" style="border-color:var(--green-bright);animation:none;">IN</div>`;
    const inIcon = L.divIcon({
      html: row.photo_base64 ? inPinHtml : inPinHtmlNoPhoto,
      className: '', iconSize: [30, 30], iconAnchor: [15, 15]
    });
    const inMarker = L.marker([inLat, inLng], { icon: inIcon, zIndexOffset: 1000 }).addTo(map);
    inMarker.bindTooltip('Sign-in', { permanent: false, direction: 'top' });
    selectedOverlay.push(inMarker);

    if (outCoords){
      const outIcon = L.divIcon({
        html: `<div class="map-pin mini state-out" style="border-color:var(--green);"><img src="${row.photo_base64||''}" alt=""></div>`,
        className: '', iconSize: [30, 30], iconAnchor: [15, 15]
      });
      const outMarker = L.marker([outCoords.lat, outCoords.lng], { icon: outIcon, zIndexOffset: 1000 }).addTo(map);
      outMarker.bindTooltip('Sign-out', { permanent: false, direction: 'top' });
      selectedOverlay.push(outMarker);

      /* Dashed line between the two */
      const line = L.polyline(
        [[inLat, inLng], [outCoords.lat, outCoords.lng]],
        { color:'#4B3B7A', weight:3, opacity:0.85, dashArray:'8,8' }
      ).addTo(map);
      selectedOverlay.push(line);

      /* Distance label at midpoint */
      const dist = haversineMeters(inLat, inLng, outCoords.lat, outCoords.lng);
      const distStr = fmtDistance(dist);
      if (distStr){
        const mid = [(inLat + outCoords.lat)/2, (inLng + outCoords.lng)/2];
        const distMarker = L.marker(mid, {
          icon: L.divIcon({ html:'', className:'', iconSize:[0,0] }),
          opacity: 0
        }).addTo(map);
        distMarker.bindTooltip(distStr, { permanent: true, direction:'top', className:'dist-tip', offset:[0,-6] });
        selectedOverlay.push(distMarker);
      }

      /* Fit bounds to include both */
      map.fitBounds([[inLat, inLng], [outCoords.lat, outCoords.lng]], { padding: [60, 60] });
    } else {
      map.setView([inLat, inLng], Math.max(map.getZoom(), 14));
    }
  }

  /* ============================================================
     Lightbox
     ============================================================ */
  function openLightbox(src){ lightboxImg.src = src; lightbox.classList.add('open'); }
  closeLightbox.addEventListener('click', () => lightbox.classList.remove('open'));
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('open'); });

  /* ============================================================
     Load
     ============================================================ */
  async function loadData(){
    let fromStr = dateFrom.value || todayStr;
    let toStr   = dateTo.value   || todayStr;
    if (fromStr > toStr){ const t = fromStr; fromStr = toStr; toStr = t; dateFrom.value = fromStr; dateTo.value = toStr; }

    listEl.innerHTML = '<div class="state-msg"><div class="spinner"></div>Loading attendance…</div>';
    punchCountEl.textContent = '—';
    refreshBtn.disabled = true;
    closeDetailView();

    try {
      const rows = await fetchAttendance(fromStr, toStr);
      allRows = Array.isArray(rows) ? rows : [];
      applyFilters();
    } catch (err){
      listEl.innerHTML = `<div class="errmsg">
        <b>Could not load attendance.</b><br>
        ${escapeHtml(err.message || 'Unknown error')}<br><br>
        Check the browser console for details.
      </div>`;
      punchCountEl.textContent = '0';
    } finally {
      refreshBtn.disabled = false;
    }
  }

  refreshBtn.addEventListener('click', loadData);
  dateFrom.addEventListener('change', loadData);
  dateTo.addEventListener('change', loadData);
  staffTypeFilter.addEventListener('change', applyFilters);
  statusFilter.addEventListener('change', applyFilters);

  let searchTimer = null;
  empIdSearch.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilters, 200);
  });

  (async function init(){
    await initMap();
    await loadData();
  })();
</script>
</body>
</html>
