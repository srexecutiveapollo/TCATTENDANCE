<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apollo Home Care — Attendance Map</title>
<meta name="theme-color" content="#1F5940">
<style>
  :root{
    --ink:#141C2B; --paper:#EEF2F1; --card:#FFFFFF;
    --pulse:#2F7A5C; --pulse-deep:#1B4C37; --pulse-soft:#EAF3EF;
    --line:#D8E0DD; --muted:#6A7A82; --danger:#B23A2E;
    --danger-soft:#FBEAE7; --radius:16px; --radius-sm:10px;
    --font-mono:ui-monospace,'SF Mono','Roboto Mono','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5; background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column; min-height:100vh;
  }

  /* ── Toolbar ─────────────────────────── */
  .toolbar{
    background:linear-gradient(135deg,var(--pulse-deep),var(--pulse));
    color:#fff; padding:14px 20px; display:flex; align-items:center;
    gap:14px; flex-wrap:wrap; flex-shrink:0;
    box-shadow:0 2px 12px rgba(27,76,55,0.25); z-index:10;
  }
  .toolbar h1{ margin:0; font-size:17px; font-weight:700; letter-spacing:-0.015em; }
  .toolbar .sub{ font-size:12px; opacity:0.8; font-family:var(--font-mono); }
  .toolbar .spacer{ flex:1; }
  .toolbar label{ font-size:12.5px; font-weight:600; opacity:0.9; display:flex; flex-direction:column; gap:4px; }
  .toolbar input[type=date]{
    padding:7px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.3);
    background:rgba(255,255,255,0.15); color:#fff; font-size:13px;
    font-family:var(--font-mono); -webkit-appearance:none;
  }
  .toolbar input[type=date]::-webkit-calendar-picker-indicator{ filter:invert(1); cursor:pointer; }
  .toolbar button{
    padding:9px 18px; border:none; border-radius:9px; background:#fff;
    color:var(--pulse-deep); font-weight:700; font-size:13.5px; cursor:pointer;
    transition:transform .1s, filter .15s;
  }
  .toolbar button:hover{ filter:brightness(0.95); }
  .toolbar button:active{ transform:scale(0.97); }
  .toolbar button:disabled{ opacity:0.5; cursor:not-allowed; }

  /* ── Layout ──────────────────────────── */
  .main{ flex:1; display:flex; min-height:0; }
  #map{ flex:1; min-height:400px; background:#dde5e2; }
  .sidebar{
    width:340px; flex-shrink:0; background:var(--card);
    border-left:1px solid var(--line); display:flex; flex-direction:column;
    overflow:hidden;
  }
  .sidebar-header{
    padding:14px 18px; border-bottom:1px solid var(--line);
    font-size:12px; font-weight:700; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--pulse-deep);
    display:flex; justify-content:space-between; align-items:center;
  }
  .sidebar-header .count{
    background:var(--pulse-soft); color:var(--pulse-deep);
    padding:2px 10px; border-radius:20px; font-size:11px;
    font-family:var(--font-mono); letter-spacing:0;
  }
  .list{ flex:1; overflow-y:auto; padding:8px; }
  .list::-webkit-scrollbar{ width:6px; }
  .list::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }

  .item{
    display:flex; gap:11px; padding:11px 10px; border-radius:12px;
    cursor:pointer; transition:background .15s; align-items:flex-start;
    border:1px solid transparent;
  }
  .item:hover{ background:#F6F9F8; border-color:var(--line); }
  .item.active{ background:var(--pulse-soft); border-color:#BFDBCF; }
  .item img.thumb{
    width:52px; height:52px; border-radius:9px; object-fit:cover;
    flex-shrink:0; border:1px solid var(--line); background:#eee;
    cursor:pointer;
  }
  .item img.thumb.empty{ display:flex; align-items:center; justify-content:center; }
  .item .info{ flex:1; min-width:0; }
  .item .name{ font-weight:700; font-size:13.5px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .meta{ font-size:11.5px; color:var(--muted); margin-top:2px; font-family:var(--font-mono); }
  .item .patient{ font-size:12px; color:var(--ink-soft); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .badge{
    display:inline-block; font-size:10px; font-weight:700; padding:1px 7px;
    border-radius:20px; margin-top:4px; letter-spacing:0.03em;
  }
  .badge.open{ background:#FDF3E0; color:#8A5A1F; }
  .badge.closed{ background:var(--pulse-soft); color:var(--pulse-deep); }

  /* ── Detail panel (slide-up) ─────────── */
  .detail{
    position:fixed; bottom:0; left:0; right:0; z-index:900;
    background:#fff; border-radius:20px 20px 0 0;
    box-shadow:0 -10px 40px -12px rgba(20,28,43,0.35);
    transform:translateY(100%); transition:transform .3s ease;
    max-height:80vh; overflow-y:auto; max-width:600px; margin:0 auto;
  }
  .detail.open{ transform:translateY(0); }
  .detail .drag-bar{
    width:44px; height:4px; border-radius:2px; background:var(--line);
    margin:10px auto 0;
  }
  .detail .d-head{ display:flex; gap:16px; padding:16px 20px 8px; align-items:center; }
  .detail .d-head img{
    width:84px; height:84px; border-radius:12px; object-fit:cover;
    border:1px solid var(--line); flex-shrink:0; background:#eee;
  }
  .detail .d-head h2{ margin:0; font-size:18px; font-weight:700; line-height:1.25; }
  .detail .d-head .d-sub{ font-size:12.5px; color:var(--muted); margin-top:4px; font-family:var(--font-mono); }
  .detail .d-body{ padding:10px 20px 26px; }
  .detail .d-row{
    display:flex; justify-content:space-between; gap:14px; padding:9px 0;
    border-bottom:1px solid var(--line-soft,#E7ECEA); font-size:13.5px;
  }
  .detail .d-row:last-child{ border-bottom:none; }
  .detail .d-row .k{ color:var(--muted); font-weight:600; flex-shrink:0; }
  .detail .d-row .v{ text-align:right; word-break:break-word; }
  .detail .d-row .v a{ color:var(--pulse-deep); font-weight:700; }
  .detail .close-detail{
    position:absolute; top:12px; right:14px; background:none; border:none;
    font-size:24px; color:var(--muted); cursor:pointer; line-height:1; padding:4px 8px;
  }
  .detail-backdrop{
    position:fixed; inset:0; background:rgba(20,28,43,0.25); z-index:850;
    opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .detail-backdrop.show{ opacity:1; pointer-events:auto; }

  /* ── States ──────────────────────────── */
  .state-msg{ padding:40px 24px; text-align:center; color:var(--muted); font-size:14px; }
  .state-msg b{ color:var(--ink); display:block; font-size:15px; margin-bottom:6px; }
  .spinner{
    width:32px; height:32px; border-radius:50%; border:3px solid var(--line);
    border-top-color:var(--pulse); margin:0 auto 16px; animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .errmsg{
    font-size:13px; color:var(--danger); padding:10px 14px;
    background:var(--danger-soft); border:1px solid #E3B4AB;
    border-radius:9px; margin:12px; line-height:1.55;
  }

  /* ── Map markers ─────────────────────── */
  .map-pin{
    width:44px; height:44px; border-radius:50%; overflow:hidden;
    border:3px solid #fff; box-shadow:0 3px 10px rgba(20,28,43,0.4);
    background:#ddd; cursor:pointer; transition:transform .15s;
  }
  .map-pin:hover{ transform:scale(1.1); }
  .map-pin img{ width:100%; height:100%; object-fit:cover; display:block; }
  .map-pin.no-photo{ display:flex; align-items:center; justify-content:center;
    font-weight:700; color:#fff; background:linear-gradient(135deg,var(--pulse-deep),var(--pulse));
    font-size:15px; }
  .map-pin.selected{ border-color:var(--pulse); box-shadow:0 0 0 4px rgba(47,122,92,0.3),0 3px 10px rgba(20,28,43,0.4); }

  /* ── Lightbox ────────────────────────── */
  .lightbox{
    position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,0.9);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,0.5); }
  .lightbox .close-lb{
    position:absolute; top:20px; right:24px; background:none; border:none;
    color:#fff; font-size:36px; cursor:pointer; line-height:1;
  }

  @media (max-width:760px){
    .main{ flex-direction:column; }
    #map{ min-height:280px; flex:0 0 45vh; }
    .sidebar{ width:100%; flex:1; border-left:none; border-top:1px solid var(--line); }
    .toolbar{ padding:11px 14px; gap:10px; }
    .toolbar h1{ font-size:15px; }
    .detail{ max-width:100%; border-radius:16px 16px 0 0; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div>
    <h1>Attendance Map</h1>
    <div class="sub">Apollo Home Care — Nurses Daily Attendance</div>
  </div>
  <div class="spacer"></div>
  <label>
    Date
    <input type="date" id="dateFilter">
  </label>
  <button type="button" id="refreshBtn">Refresh</button>
</div>

<div class="main">
  <div id="map"></div>
  <div class="sidebar">
    <div class="sidebar-header">
      <span>Punches</span>
      <span class="count" id="punchCount">—</span>
    </div>
    <div class="list" id="list">
      <div class="state-msg"><div class="spinner"></div>Loading attendance…</div>
    </div>
  </div>
</div>

<!-- Detail bottom sheet -->
<div class="detail-backdrop" id="detailBackdrop"></div>
<div class="detail" id="detailPanel">
  <button type="button" class="close-detail" id="closeDetail" aria-label="Close">&times;</button>
  <div class="drag-bar"></div>
  <div id="detailContent"></div>
</div>

<!-- Photo lightbox -->
<div class="lightbox" id="lightbox">
  <button type="button" class="close-lb" id="closeLightbox" aria-label="Close">&times;</button>
  <img id="lightboxImg" alt="Full photo">
</div>

<script>
  /* ============================================================
     CONFIG — same Supabase project as the attendance app
     ============================================================ */
  const SUPABASE_URL      = 'https://pdgxpgvwgnptxdvffgos.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkZ3hwZ3Z3Z25wdHhkdmZmZ29zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwODE4NzQsImV4cCI6MjEwODY1Nzg3NH0.MT7IQIbwfLumBoUQ3PaXipoJti14z10rz8NBzqMMASo';

  /* The attendance table — adjust if yours is named differently.
     Expected columns: submission_id, employee_id, nurse_name, care_centre,
     patient_name, sign_in_at, sign_out_at, latitude, longitude, accuracy_meters,
     location_text, remarks, photo_base64, emp_type.                        */
  const TABLE = 'attendance';

  /* Google Maps API key — replace with your own.
     Enable "Maps JavaScript API" in Google Cloud Console.
     Alternatively, the map falls back to OpenStreetMap/Leaflet if you prefer
     to avoid a key — see USE_LEAFLET below.                                */
  const GOOGLE_MAPS_API_KEY = 'YOUR_GOOGLE_MAPS_API_KEY_HERE';
  const USE_LEAFLET = true; // set false to force Google Maps

  /* ============================================================
     State
     ============================================================ */
  let map = null;
  let markers = [];
  let allRows = [];
  let filteredRows = [];
  let mapReady = false;
  let selectedId = null;

  const dateFilter   = document.getElementById('dateFilter');
  const refreshBtn   = document.getElementById('refreshBtn');
  const listEl       = document.getElementById('list');
  const punchCountEl = document.getElementById('punchCount');
  const detailPanel  = document.getElementById('detailPanel');
  const detailContent= document.getElementById('detailContent');
  const detailBackdrop = document.getElementById('detailBackdrop');
  const closeDetail  = document.getElementById('closeDetail');
  const lightbox     = document.getElementById('lightbox');
  const lightboxImg  = document.getElementById('lightboxImg');
  const closeLightbox= document.getElementById('closeLightbox');

  /* Default date filter = today (local) */
  function localDateStr(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  dateFilter.value = localDateStr(new Date());

  /* ============================================================
     Helpers
     ============================================================ */
  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => (
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
    ));
  }
  function fmtTime(iso){
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  }
  function fmtDateTime(iso){
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }) +
      ' ' + d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  }
  function fmtDuration(ms){
    if (!isFinite(ms) || ms < 0) return '—';
    const totalMin = Math.round(ms / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return (h > 0 ? h + 'h ' : '') + m + 'm';
  }
  function initials(name){
    return String(name || '?').trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
  }

  /* ============================================================
     Supabase REST fetch
     ============================================================ */
  async function fetchAttendance(dateStr){
    // We query rows whose duty_date (or sign_in_at) is on the given date.
    // Try duty_date column first (the attendance app writes sign_in_at as timestamptz).
    const start = new Date(dateStr + 'T00:00:00');
    const end   = new Date(dateStr + 'T23:59:59.999');
    const startIso = start.toISOString();
    const endIso   = end.toISOString();

    const url = SUPABASE_URL + '/rest/v1/' + TABLE +
      '?select=*' +
      '&sign_in_at=gte.' + encodeURIComponent(startIso) +
      '&sign_in_at=lte.' + encodeURIComponent(endIso) +
      '&order=sign_in_at.desc';

    const res = await fetch(url, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Accept': 'application/json'
      }
    });
    if (!res.ok) {
      const text = await res.text();
      let msg = 'HTTP ' + res.status;
      try { const j = JSON.parse(text); msg = j.message || j.hint || msg; } catch(e){}
      throw new Error(msg);
    }
    return await res.json();
  }

  /* ============================================================
     Map bootstrap
     ============================================================ */
  function loadScript(src){
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function initMap(){
    if (USE_LEAFLET || !GOOGLE_MAPS_API_KEY || GOOGLE_MAPS_API_KEY === 'YOUR_GOOGLE_MAPS_API_KEY_HERE') {
      await initLeafletMap();
    } else {
      try {
        await loadScript('https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(GOOGLE_MAPS_API_KEY));
        initGoogleMap();
      } catch (e) {
        console.warn('Google Maps failed, falling back to Leaflet', e);
        await initLeafletMap();
      }
    }
  }

  /* ── Leaflet (no API key needed) ─────── */
  let L = null;
  async function initLeafletMap(){
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(link);
    await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
    L = window.L;
    map = L.map('map', { zoomControl: true }).setView([20.5937, 78.9629], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    mapReady = true;
    plotAll();
  }

  /* ── Google Maps ─────────────────────── */
  function initGoogleMap(){
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 20.5937, lng: 78.9629 },
      zoom: 5,
      mapTypeControl: false,
      streetViewControl: false
    });
    mapReady = true;
    plotAll();
  }

  /* ============================================================
     Plot markers
     ============================================================ */
  function clearMarkers(){
    if (L) {
      markers.forEach(m => map.removeLayer(m));
    } else if (window.google && map) {
      markers.forEach(m => m.setMap(null));
    }
    markers = [];
  }

  function plotAll(){
    if (!mapReady) return;
    clearMarkers();
    const withCoords = filteredRows.filter(r =>
      r.latitude != null && r.longitude != null &&
      isFinite(Number(r.latitude)) && isFinite(Number(r.longitude))
    );

    if (!withCoords.length) return;

    withCoords.forEach(row => {
      addMarker(row);
    });

    /* Fit bounds */
    const bounds = withCoords.map(r => [Number(r.latitude), Number(r.longitude)]);
    if (L) {
      if (withCoords.length === 1) {
        map.setView(bounds[0], 14);
      } else {
        map.fitBounds(bounds, { padding: [40, 40] });
      }
    } else if (window.google && map) {
      const gb = new google.maps.LatLngBounds();
      bounds.forEach(b => gb.extend({ lat: b[0], lng: b[1] }));
      if (withCoords.length === 1) {
        map.setCenter({ lat: bounds[0][0], lng: bounds[0][1] });
        map.setZoom(14);
      } else {
        map.fitBounds(gb, 60);
      }
    }
  }

  function addMarker(row){
    const lat = Number(row.latitude);
    const lng = Number(row.longitude);
    const hasPhoto = !!row.photo_base64;
    const photo = hasPhoto ? row.photo_base64 : '';
    const init = initials(row.nurse_name);

    if (L) {
      const iconHtml = hasPhoto
        ? `<div class="map-pin" data-id="${escapeHtml(row.submission_id || row.employee_id)}"><img src="${photo}" alt=""></div>`
        : `<div class="map-pin no-photo" data-id="${escapeHtml(row.submission_id || row.employee_id)}">${escapeHtml(init)}</div>`;
      const icon = L.divIcon({
        html: iconHtml,
        className: '',
        iconSize: [44, 44],
        iconAnchor: [22, 22]
      });
      const marker = L.marker([lat, lng], { icon }).addTo(map);
      marker.on('click', () => selectRow(row, marker));
      marker._row = row;
      markers.push(marker);
    } else if (window.google && map) {
      const marker = new google.maps.Marker({
        position: { lat, lng },
        map,
        title: row.nurse_name || '',
        icon: {
          url: hasPhoto ? photo : 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44"><circle cx="22" cy="22" r="20" fill="#2F7A5C"/><text x="22" y="28" font-size="15" font-family="Arial" fill="#fff" text-anchor="middle" font-weight="bold">${init}</text></svg>`
          ),
          scaledSize: new google.maps.Size(44, 44),
          anchor: new google.maps.Point(22, 22)
        }
      });
      marker.addListener('click', () => selectRow(row, marker));
      marker._row = row;
      markers.push(marker);
    }
  }

  /* ============================================================
     Sidebar list
     ============================================================ */
  function renderList(){
    if (!filteredRows.length) {
      listEl.innerHTML = '<div class="state-msg"><b>No attendance found</b>Try a different date or tap Refresh.</div>';
      punchCountEl.textContent = '0';
      return;
    }
    punchCountEl.textContent = String(filteredRows.length);
    listEl.innerHTML = filteredRows.map(row => {
      const id = row.submission_id || row.employee_id;
      const hasPhoto = !!row.photo_base64;
      const thumb = hasPhoto
        ? `<img class="thumb" src="${row.photo_base64}" alt="" data-photo="${escapeHtml(row.photo_base64)}">`
        : `<div class="thumb" style="display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:linear-gradient(135deg,#1B4C37,#2F7A5C);font-size:16px;">${escapeHtml(initials(row.nurse_name))}</div>`;
      const badge = row.sign_out_at
        ? '<span class="badge closed">Signed out</span>'
        : '<span class="badge open">Open shift</span>';
      return `
        <div class="item${selectedId === id ? ' active' : ''}" data-id="${escapeHtml(id)}">
          ${thumb}
          <div class="info">
            <div class="name">${escapeHtml(row.nurse_name || '—')}</div>
            <div class="meta">${escapeHtml(row.employee_id || '')} · ${escapeHtml(row.care_centre || '')}</div>
            <div class="patient">👤 ${escapeHtml(row.patient_name || 'No patient')}</div>
            ${badge}
            <div class="meta" style="margin-top:4px;">In ${escapeHtml(fmtTime(row.sign_in_at))}${row.sign_out_at ? ' · Out ' + escapeHtml(fmtTime(row.sign_out_at)) : ''}</div>
          </div>
        </div>`;
    }).join('');

    /* Attach click handlers */
    listEl.querySelectorAll('.item').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.classList.contains('thumb') && e.target.dataset.photo) {
          openLightbox(e.target.dataset.photo); return;
        }
        const id = el.dataset.id;
        const row = filteredRows.find(r => (r.submission_id || r.employee_id) === id);
        if (row) selectRow(row, null);
      });
    });
  }

  /* ============================================================
     Selection & detail
     ============================================================ */
  function selectRow(row, marker){
    selectedId = row.submission_id || row.employee_id;

    /* Highlight list */
    listEl.querySelectorAll('.item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === selectedId);
    });

    /* Pan map to marker */
    if (mapReady && row.latitude != null && row.longitude != null) {
      const lat = Number(row.latitude), lng = Number(row.longitude);
      if (L) {
        map.setView([lat, lng], Math.max(map.getZoom(), 14), { animate: true });
      } else if (window.google && map) {
        map.panTo({ lat, lng });
        map.setZoom(Math.max(map.getZoom(), 14));
      }
    }

    /* Highlight marker */
    markers.forEach(m => {
      const isMatch = (m._row && (m._row.submission_id || m._row.employee_id) === selectedId);
      if (L && m.getElement) {
        const pin = m.getElement().querySelector('.map-pin');
        if (pin) pin.classList.toggle('selected', isMatch);
      }
    });

    showDetail(row);
  }

  function showDetail(row){
    const hasPhoto = !!row.photo_base64;
    const photoHtml = hasPhoto
      ? `<img src="${row.photo_base64}" alt="Verification photo" data-photo="${escapeHtml(row.photo_base64)}" style="cursor:zoom-in">`
      : `<div style="width:84px;height:84px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1B4C37,#2F7A5C);color:#fff;font-weight:700;font-size:24px;">${escapeHtml(initials(row.nurse_name))}</div>`;

    const durationMs = row.sign_in_at && row.sign_out_at
      ? new Date(row.sign_out_at).getTime() - new Date(row.sign_in_at).getTime()
      : null;

    const mapLink = (row.latitude != null && row.longitude != null)
      ? `<a href="https://maps.google.com/?q=${Number(row.latitude)},${Number(row.longitude)}" target="_blank" rel="noopener">Open in Maps ↗</a>`
      : '—';

    detailContent.innerHTML = `
      <div class="d-head">
        ${photoHtml}
        <div>
          <h2>${escapeHtml(row.nurse_name || '—')}</h2>
          <div class="d-sub">${escapeHtml(row.employee_id || '')} · ${escapeHtml(row.care_centre || '')}</div>
          <div class="d-sub">${escapeHtml(row.emp_type || '')}</div>
        </div>
      </div>
      <div class="d-body">
        <div class="d-row"><span class="k">Patient</span><span class="v">${escapeHtml(row.patient_name || '—')}</span></div>
        <div class="d-row"><span class="k">Signed in</span><span class="v">${escapeHtml(fmtDateTime(row.sign_in_at))}</span></div>
        <div class="d-row"><span class="k">Signed out</span><span class="v">${escapeHtml(row.sign_out_at ? fmtDateTime(row.sign_out_at) : 'Still open')}</span></div>
        <div class="d-row"><span class="k">Duration</span><span class="v">${durationMs != null ? fmtDuration(durationMs) : '—'}</span></div>
        <div class="d-row"><span class="k">Sign-in location</span><span class="v">${escapeHtml(row.location_text || '—')}</span></div>
        <div class="d-row"><span class="k">GPS</span><span class="v">${row.latitude != null ? Number(row.latitude).toFixed(5) + ', ' + Number(row.longitude).toFixed(5) : '—'}<br>${mapLink}</span></div>
        <div class="d-row"><span class="k">Accuracy</span><span class="v">${row.accuracy_meters != null ? escapeHtml(row.accuracy_meters) + ' m' : '—'}</span></div>
        <div class="d-row"><span class="k">Remarks</span><span class="v">${escapeHtml(row.remarks || '—')}</span></div>
      </div>`;

    /* Bind photo zoom */
    const img = detailContent.querySelector('img[data-photo]');
    if (img) img.addEventListener('click', () => openLightbox(img.dataset.photo));

    detailPanel.classList.add('open');
    detailBackdrop.classList.add('show');
  }

  function closeDetailPanel(){
    detailPanel.classList.remove('open');
    detailBackdrop.classList.remove('show');
    selectedId = null;
    listEl.querySelectorAll('.item.active').forEach(el => el.classList.remove('active'));
    markers.forEach(m => {
      if (L && m.getElement) {
        const pin = m.getElement().querySelector('.map-pin');
        if (pin) pin.classList.remove('selected');
      }
    });
  }

  closeDetail.addEventListener('click', closeDetailPanel);
  detailBackdrop.addEventListener('click', closeDetailPanel);

  /* ============================================================
     Lightbox
     ============================================================ */
  function openLightbox(src){
    lightboxImg.src = src;
    lightbox.classList.add('open');
  }
  closeLightbox.addEventListener('click', () => lightbox.classList.remove('open'));
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) lightbox.classList.remove('open');
  });

  /* ============================================================
     Load data
     ============================================================ */
  async function loadData(){
    const dateStr = dateFilter.value || localDateStr(new Date());
    listEl.innerHTML = '<div class="state-msg"><div class="spinner"></div>Loading attendance…</div>';
    punchCountEl.textContent = '—';
    refreshBtn.disabled = true;

    try {
      const rows = await fetchAttendance(dateStr);
      allRows = Array.isArray(rows) ? rows : [];
      filteredRows = allRows;
      renderList();
      plotAll();
    } catch (err) {
      console.error(err);
      listEl.innerHTML = `<div class="errmsg"><b>Could not load attendance.</b><br>${escapeHtml(err.message || 'Unknown error')}<br><br>Check that the <code>${escapeHtml(TABLE)}</code> table exists and that Row Level Security allows anonymous SELECT, or that your policy permits reading.</div>`;
      punchCountEl.textContent = '0';
    } finally {
      refreshBtn.disabled = false;
    }
  }

  refreshBtn.addEventListener('click', loadData);
  dateFilter.addEventListener('change', loadData);

  /* ============================================================
     Init
     ============================================================ */
  (async function init(){
    await initMap();
    await loadData();
  })();
</script>
</body>
</html>
