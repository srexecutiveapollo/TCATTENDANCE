<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apollo Home Care — Attendance Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --ink:#16233B; --paper:#EDF2F1; --card:#FFFFFF;
    --pulse:#2F7A5C; --pulse-deep:#1F5940; --line:#D7DFDD; --muted:#5C6B72; --danger:#B23A2E;
  }
  *{ box-sizing:border-box; }
  html, body{ margin:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:var(--ink); background:var(--paper); }

  .topbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    padding:12px 14px; background:var(--card); border-bottom:1px solid var(--line);
    position:relative; z-index:1000;
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-right:14px; }
  .brand img{ height:36px; width:auto; border-radius:6px; }
  .brand h1{ font-size:15px; margin:0; font-weight:700; white-space:nowrap; }

  .topbar label{ font-size:11px; font-weight:600; color:var(--muted); display:block; margin-bottom:3px; }
  .field-group{ display:flex; flex-direction:column; }
  .topbar input, .topbar select{
    padding:7px 9px; border:1px solid #C9D3D1; border-radius:7px; font-size:13px;
    font-family:ui-monospace,'SF Mono','Roboto Mono','Courier New',monospace; background:#FBFCFC; color:var(--ink);
  }
  .topbar select{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; min-width:130px; }
  .topbar button{
    padding:8px 16px; border:none; border-radius:7px; background:var(--pulse-deep); color:#fff;
    font-size:13px; font-weight:600; cursor:pointer; align-self:flex-end;
  }
  .topbar button:hover{ background:var(--pulse); }
  .count-badge{ font-size:12px; color:var(--muted); align-self:flex-end; padding-bottom:8px; white-space:nowrap; }

  /* Search field with clear button */
  .search-group{ position:relative; min-width:180px; }
  .search-group input{ padding-right:28px; width:100%; }
  .search-clear{
    position:absolute; right:8px; bottom:7px; cursor:pointer;
    background:none; border:none; color:var(--muted); font-size:15px; line-height:1;
    padding:0; display:none;
  }
  .search-clear.visible{ display:block; }

  .map-wrap{ position:relative; height:calc(100% - 66px); }
  #map{ position:absolute; top:0; left:0; right:0; bottom:0; }

  .legend{
    position:absolute; bottom:20px; left:12px; z-index:900; background:var(--card);
    border:1px solid var(--line); border-radius:9px; padding:9px 12px; font-size:12px;
    box-shadow:0 2px 8px rgba(22,35,59,0.12);
  }
  .legend div{ display:flex; align-items:center; gap:6px; margin:3px 0; }
  .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  .dot.ring{ background:transparent; border:2.5px solid #B23A2E; }
  .dot.fill{ background:#2F7A5C; }

  .leaflet-popup-content{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:12.5px; line-height:1.6; }
  .leaflet-popup-content b{ color:var(--pulse-deep); }
  .popup-photo{ display:block; width:100%; max-width:200px; border-radius:7px; margin-top:8px; border:1px solid var(--line); }
  .popup-badge{ display:inline-block; padding:1px 7px; border-radius:5px; font-size:11px; font-weight:700; margin-left:4px; }
  .popup-badge.late{ background:#FBEAE7; color:var(--danger); }
  .popup-badge.ontime{ background:#EAF3EF; color:var(--pulse-deep); }
  .popup-badge.signedout{ background:#EAF3EF; color:var(--pulse-deep); }
  .popup-badge.signedin{ background:#FFF6E5; color:#8A5A1F; }

  .custom-pin-icon{ background:transparent; border:none; }
  .pin-wrap{ display:flex; flex-direction:column; align-items:center; cursor:pointer; }
  .pin-avatar{
    width:40px; height:40px; border-radius:50%; border:3px solid #8A94A6;
    background:#fff; box-shadow:0 2px 6px rgba(22,35,59,0.28);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    position:relative;
  }
  /* Signed-in (still on duty) = filled green + pulsing dot */
  .pin-avatar.on-duty{ border-color:#2F7A5C; }
  .pin-avatar.on-duty::after{
    content:''; position:absolute; top:-3px; right:-3px;
    width:12px; height:12px; border-radius:50%;
    background:#E8B84B; border:2px solid #fff;
    box-shadow:0 0 0 0 rgba(232,184,75,0.7);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(232,184,75,0.7); }
    70%{ box-shadow:0 0 0 8px rgba(232,184,75,0); }
    100%{ box-shadow:0 0 0 0 rgba(232,184,75,0); }
  }
  /* Signed-out = grey ring */
  .pin-avatar.signed-out{ border-color:#8A94A6; opacity:0.85; }

  .pin-avatar-img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pin-avatar-initials{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:13px; font-weight:700; color:var(--ink); }
  .pin-label{
    margin-top:2px; background:#fff; border:1.5px solid #8A94A6; border-radius:6px;
    padding:1px 6px; font-size:10px; font-weight:600; color:var(--ink); white-space:nowrap;
    box-shadow:0 1px 3px rgba(22,35,59,0.18); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }

  .loading-note{
    position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:900;
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:8px 14px; font-size:12.5px; color:var(--muted); display:none;
  }

  .no-results{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:900;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:16px 22px; font-size:13px; color:var(--muted); display:none;
    box-shadow:0 4px 16px rgba(22,35,59,0.12); text-align:center;
  }
  .no-results.visible{ display:block; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="logo.png" alt="Apollo Home Care">
    <h1>📍 Attendance Map</h1>
  </div>

  <!-- NEW: Employee ID / Name search -->
  <div class="field-group search-group">
    <label for="searchBox">Search Emp ID / Name</label>
    <input type="text" id="searchBox" placeholder="e.g. AHC1234 or Vishnu" autocomplete="off">
    <button type="button" class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
  </div>

  <div class="field-group">
    <label for="startDate">From</label>
    <input type="date" id="startDate">
  </div>
  <div class="field-group">
    <label for="endDate">To</label>
    <input type="date" id="endDate">
  </div>
  <div class="field-group">
    <label for="centreFilter">Care Centre</label>
    <select id="centreFilter">
      <option value="">All Centres</option>
      <option value="Mumbai">Mumbai</option>
      <option value="Bangalore">Bangalore</option>
      <option value="Chennai">Chennai</option>
      <option value="Hyderabad">Hyderabad</option>
      <option value="Madurai">Madurai</option>
      <option value="Mysore">Mysore</option>
      <option value="Delhi">Delhi</option>
      <option value="Indore">Indore</option>
      <option value="Kolkata">Kolkata</option>
      <option value="Guwahati">Guwahati</option>
    </select>
  </div>
  <div class="field-group">
    <label for="empTypeFilter">Emp Type</label>
    <select id="empTypeFilter">
      <option value="">All Emp Types</option>
      <option value="Onroll">Onroll</option>
      <option value="AEN">AEN</option>
      <option value="Agency">Agency</option>
    </select>
  </div>
  <div class="field-group">
    <label for="dutyTypeFilter">Duty Type</label>
    <select id="dutyTypeFilter">
      <option value="">All Duty Types</option>
      <option value="12 Hrs Day">12 Hrs Day</option>
      <option value="12 Hrs Night">12 Hrs Night</option>
      <option value="24 Hrs stay duty">24 Hrs stay duty</option>
      <option value="On Call">On Call</option>
    </select>
  </div>
  <div class="field-group">
    <label for="statusFilter">Status</label>
    <select id="statusFilter">
      <option value="">All</option>
      <option value="in">Signed In (on duty)</option>
      <option value="out">Signed Out</option>
    </select>
  </div>

  <button id="loadBtn">Load</button>
  <div class="count-badge" id="countBadge"></div>
</div>

<div class="map-wrap">
  <div id="map"></div>
  <div class="loading-note" id="loadingNote">Loading attendance…</div>
  <div class="no-results" id="noResults">No matching records.<br><span style="font-size:11.5px;">Try clearing the search or widening the date range.</span></div>
  <div class="legend">
    <div><span class="dot fill"></span> Signed in (on duty)</div>
    <div><span class="dot ring"></span> Signed out</div>
    <div style="margin-top:6px;font-size:11px;color:var(--muted);">Dot colour inside pin = duty type</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ── Configuration ────────────────────────────────────────
  const SUPABASE_URL      = 'https://pdgxpgvwgnptxdvffgos.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_FpqLF9z4wAxV7Jd-7ZLk2A_j0u74m80';

  // ── Map init ─────────────────────────────────────────────
  const map = L.map('map').setView([20.5937, 78.9629], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  let allRecords = [];   // every row fetched from Supabase
  let markers    = [];   // currently drawn markers

  // ── Utilities ────────────────────────────────────────────
  function getInitials(name){
    return String(name || '?').trim().split(/\s+/).map(w => w[0] || '').slice(0, 2).join('').toUpperCase();
  }
  function shortName(name){
    const n = String(name || '').trim();
    return n.length > 13 ? n.slice(0, 12) + '…' : n;
  }
  function escapeHtml(str){
    return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function dutyColor(dutyType){
    if (dutyType === '12 Hrs Night')     return '#1F6FB2';
    if (dutyType === '24 Hrs stay duty') return '#D98E1F';
    if (dutyType === 'On Call')          return '#8A4FB8';
    return '#2F7A5C'; // 12 Hrs Day
  }
  function isSignedOut(r){
    return !!(r.sign_out_at && String(r.sign_out_at).trim());
  }

  // ── Marker icon ──────────────────────────────────────────
  function buildMarkerIcon(r){
    const color    = dutyColor(r.duty_type);
    const signedOut = isSignedOut(r);
    const avatarInner = r.photo_base64
      ? '<img src="' + escapeHtml(r.photo_base64) + '" class="pin-avatar-img">'
      : '<span class="pin-avatar-initials">' + escapeHtml(getInitials(r.nurse_name)) + '</span>';

    const avatarClass = signedOut ? 'pin-avatar signed-out' : 'pin-avatar on-duty';
    const labelColor  = signedOut ? '#8A94A6' : color;

    const html =
      '<div class="pin-wrap">' +
        '<div class="' + avatarClass + '">' + avatarInner + '</div>' +
        '<div class="pin-label" style="border-color:' + labelColor + ';">' +
          escapeHtml(shortName(r.nurse_name)) +
        '</div>' +
      '</div>';

    return L.divIcon({
      html: html,
      className: 'custom-pin-icon',
      iconSize: [64, 56],
      iconAnchor: [32, 56],
      popupAnchor: [0, -56]
    });
  }

  // ── Popup content ────────────────────────────────────────
  function buildPopupHtml(r){
    const out = isSignedOut(r);
    const statusBadge = out
      ? '<span class="popup-badge signedout">Signed Out</span>'
      : '<span class="popup-badge signedin">On Duty</span>';

    const punctBadge = r.punctuality === 'Late'
      ? '<span class="popup-badge late">Late</span>'
      : (r.punctuality === 'On Time' ? '<span class="popup-badge ontime">On Time</span>' : '');

    const photoHtml = r.photo_base64
      ? '<img src="' + escapeHtml(r.photo_base64) + '" alt="Check-in photo" class="popup-photo">'
      : '';

    // Sign-in vs sign-out location
    const signInLine =
      'In: ' + escapeHtml(r.duty_date || '—') + ' ' + escapeHtml(r.duty_time || '') +
      (r.location_text ? '<br>&nbsp;&nbsp;&nbsp;@ ' + escapeHtml(r.location_text) : '');

    const signOutLine = out
      ? '<br><b>Sign-out:</b> ' + escapeHtml(formatDateTime(r.sign_out_at)) +
        (r.sign_out_location ? '<br>&nbsp;&nbsp;&nbsp;@ ' + escapeHtml(r.sign_out_location) : '') +
        (r.sign_out_latitude && r.sign_out_longitude
          ? '<br><a href="https://maps.google.com/?q=' + r.sign_out_latitude + ',' + r.sign_out_longitude +
            '" target="_blank" rel="noopener" style="color:#1F5940;font-weight:600;">Sign-out map ↗</a>'
          : '')
      : '';

    return (
      '<b>' + escapeHtml(r.nurse_name) + '</b> (' + escapeHtml(r.employee_id || '') + ')' +
      statusBadge + punctBadge + '<br>' +
      escapeHtml(r.care_centre) + ' · ' + escapeHtml(r.emp_type || '—') + '<br>' +
      'Shift: ' + escapeHtml(r.duty_type || '—') + '<br>' +
      'Patient: ' + escapeHtml(r.patient_name || 'N/A') + '<br>' +
      signInLine + signOutLine +
      photoHtml
    );
  }

  function formatDateTime(iso){
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) +
      ' ' + d.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
  }

  // ── Draw filtered records ────────────────────────────────
  function clearMarkers(){
    markers.forEach(m => map.removeLayer(m));
    markers = [];
  }

  function plotRecords(records){
    clearMarkers();
    const noResultsEl = document.getElementById('noResults');

    const valid = records.filter(r =>
      typeof r.latitude === 'number' && typeof r.longitude === 'number'
    );

    if (valid.length === 0) {
      noResultsEl.classList.add('visible');
    } else {
      noResultsEl.classList.remove('visible');
    }

    const centreSet = new Set();
    let inCount = 0, outCount = 0;

    valid.forEach(r => {
      centreSet.add(r.care_centre);
      if (isSignedOut(r)) outCount++; else inCount++;

      const marker = L.marker([r.latitude, r.longitude], { icon: buildMarkerIcon(r) }).addTo(map);
      marker.bindPopup(buildPopupHtml(r));
      markers.push(marker);
    });

    if (valid.length > 0) {
      const bounds = L.latLngBounds(valid.map(r => [r.latitude, r.longitude]));
      // If only one point, zoom to it manually rather than fit a 0-size bounds
      if (valid.length === 1) {
        map.setView([valid[0].latitude, valid[0].longitude], 14);
      } else {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
      }
    } else {
      map.setView([20.5937, 78.9629], 5);
    }

    document.getElementById('countBadge').textContent =
      valid.length + ' shown · ' + inCount + ' in · ' + outCount + ' out · ' +
      centreSet.size + ' centre' + (centreSet.size === 1 ? '' : 's');
  }

  // ── Client-side filter (search + status) ────────────────
  function applyFilters(){
    const q      = document.getElementById('searchBox').value.trim().toLowerCase();
    const status = document.getElementById('statusFilter').value;

    const clearBtn = document.getElementById('searchClear');
    clearBtn.classList.toggle('visible', q.length > 0);

    let filtered = allRecords;

    if (q) {
      filtered = filtered.filter(r =>
        String(r.employee_id || '').toLowerCase().includes(q) ||
        String(r.nurse_name  || '').toLowerCase().includes(q)
      );
    }
    if (status === 'in')  filtered = filtered.filter(r => !isSignedOut(r));
    if (status === 'out') filtered = filtered.filter(r =>  isSignedOut(r));

    plotRecords(filtered);
  }

  // ── Fetch from Supabase ──────────────────────────────────
  async function loadData(){
    const start    = document.getElementById('startDate').value;
    const end      = document.getElementById('endDate').value;
    const centre   = document.getElementById('centreFilter').value;
    const empType  = document.getElementById('empTypeFilter').value;
    const dutyType = document.getElementById('dutyTypeFilter').value;

    const loadingNote = document.getElementById('loadingNote');
    loadingNote.style.display = 'block';
    loadingNote.textContent = 'Loading attendance…';

    let url = SUPABASE_URL + '/rest/v1/attendance'
            + '?select=submission_id,nurse_name,employee_id,emp_type,care_centre,'
            + 'duty_date,duty_time,duty_type,patient_name,location_text,'
            + 'latitude,longitude,punctuality,submitted_at,photo_base64,'
            + 'sign_out_at,sign_out_location,sign_out_latitude,sign_out_longitude'
            + '&order=submitted_at.desc';

    if (start && end) {
      url += '&duty_date=gte.' + encodeURIComponent(start)
           + '&duty_date=lte.' + encodeURIComponent(end);
    }
    if (centre)   url += '&care_centre=eq.' + encodeURIComponent(centre);
    if (empType)  url += '&emp_type=eq.'    + encodeURIComponent(empType);
    if (dutyType) url += '&duty_type=eq.'   + encodeURIComponent(dutyType);

    try {
      const res = await fetch(url, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
        }
      });

      if (!res.ok) {
        const txt = await res.text();
        alert('Could not load attendance: ' + txt.slice(0, 200));
        return;
      }

      allRecords = await res.json();
      applyFilters();
    } catch (err) {
      alert('Could not load attendance. Check your connection and try again.');
    } finally {
      loadingNote.style.display = 'none';
    }
  }

  // ── Wire up controls ─────────────────────────────────────
  document.getElementById('loadBtn').addEventListener('click', loadData);

  document.getElementById('searchBox').addEventListener('input', applyFilters);
  document.getElementById('searchClear').addEventListener('click', () => {
    const box = document.getElementById('searchBox');
    box.value = '';
    box.focus();
    applyFilters();
  });
  document.getElementById('statusFilter').addEventListener('change', applyFilters);

  // Also live-filter on the other dropdowns after first load — no extra network call
  ['centreFilter','empTypeFilter','dutyTypeFilter'].forEach(id => {
    document.getElementById(id).addEventListener('change', loadData);
  });

  // Default date range: last 30 days
  const dEnd   = new Date();
  const dStart = new Date(Date.now() - 30 * 24 * 3600 * 1000);
  const fmt = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  document.getElementById('startDate').value = fmt(dStart);
  document.getElementById('endDate').value   = fmt(dEnd);

  loadData();
</script>
</body>
</html>
