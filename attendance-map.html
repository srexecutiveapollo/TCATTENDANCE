<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apollo Home Care — Attendance Map</title>
<meta name="theme-color" content="#1F5940">
<style>
  :root{
    --ink:#141C2B; --paper:#EEF2F1; --card:#FFFFFF;
    --pulse:#2F7A5C; --pulse-deep:#1B4C37; --pulse-soft:#EAF3EF;
    --line:#D8E0DD; --muted:#6A7A82; --danger:#B23A2E;
    --danger-soft:#FBEAE7; --radius:16px; --radius-sm:10px;
    --font-mono:ui-monospace,'SF Mono','Roboto Mono','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5; background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column; min-height:100vh;
  }

  /* ── Debug banner ─────────────────── */
  .debug{
    background:#0F1620; color:#C9D6E0; font-family:var(--font-mono);
    font-size:11.5px; line-height:1.7; padding:10px 16px;
    max-height:180px; overflow-y:auto; flex-shrink:0;
    border-bottom:2px solid var(--pulse);
  }
  .debug.hidden{ display:none; }
  .debug .row{ display:flex; gap:8px; }
  .debug .tag{ flex-shrink:0; padding:0 6px; border-radius:4px; font-weight:700; }
  .debug .tag.ok  { background:#1B4C37; color:#8EE7B5; }
  .debug .tag.err { background:#5A1F1A; color:#FF9E8F; }
  .debug .tag.info{ background:#25384D; color:#9EC3E8; }
  .debug .msg{ white-space:pre-wrap; word-break:break-word; }

  /* ── Toolbar ─────────────────────── */
  .toolbar{
    background:linear-gradient(135deg,var(--pulse-deep),var(--pulse));
    color:#fff; padding:12px 20px; display:flex; align-items:center;
    gap:14px; flex-wrap:wrap; flex-shrink:0;
    box-shadow:0 2px 12px rgba(27,76,55,0.25); z-index:10;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand img.logo{
    height:42px; width:auto; min-width:42px; border-radius:8px; background:#fff; padding:3px;
    object-fit:contain;
  }
  .brand .divider{ width:1px; height:32px; background:rgba(255,255,255,0.35); }
  .brand h1{ margin:0; font-size:17px; font-weight:700; letter-spacing:-0.015em; line-height:1.15; }
  .brand .sub{ font-size:11.5px; opacity:0.85; font-family:var(--font-mono); }

  .toolbar .spacer{ flex:1; }

  .filters{ display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; }
  .filters label{
    font-size:11px; font-weight:700; opacity:0.9; letter-spacing:0.05em;
    text-transform:uppercase; display:flex; flex-direction:column; gap:4px;
  }
  .filters input, .filters select{
    padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.3);
    background:rgba(255,255,255,0.15); color:#fff; font-size:13px;
    font-family:var(--font-mono); min-height:36px;
  }
  .filters input::placeholder{ color:rgba(255,255,255,0.65); }
  .filters select option{ color:var(--ink); background:#fff; }
  .filters input[type=date]::-webkit-calendar-picker-indicator{ filter:invert(1); cursor:pointer; }
  .filters input:focus, .filters select:focus{ outline:2px solid rgba(255,255,255,0.6); }
  .toolbar button{
    padding:9px 18px; border:none; border-radius:9px; background:#fff;
    color:var(--pulse-deep); font-weight:700; font-size:13.5px; cursor:pointer;
    transition:transform .1s, filter .15s; min-height:36px;
  }
  .toolbar button:hover{ filter:brightness(0.95); }
  .toolbar button:active{ transform:scale(0.97); }
  .toolbar button:disabled{ opacity:0.5; cursor:not-allowed; }

  /* ── Layout ─────────────────────── */
  .main{ flex:1; display:flex; min-height:0; }
  #map{ flex:1; min-height:400px; background:#dde5e2; }
  .sidebar{
    width:360px; flex-shrink:0; background:var(--card);
    border-left:1px solid var(--line); display:flex; flex-direction:column;
    overflow:hidden;
  }
  .sidebar-header{
    padding:12px 18px; border-bottom:1px solid var(--line);
    font-size:12px; font-weight:700; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--pulse-deep);
    display:flex; justify-content:space-between; align-items:center;
  }
  .sidebar-header .count{
    background:var(--pulse-soft); color:var(--pulse-deep);
    padding:2px 10px; border-radius:20px; font-size:11px;
    font-family:var(--font-mono); letter-spacing:0;
  }
  .list{ flex:1; overflow-y:auto; padding:8px; }
  .list::-webkit-scrollbar{ width:6px; }
  .list::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }

  .item{
    display:flex; gap:11px; padding:11px 10px; border-radius:12px;
    cursor:pointer; transition:background .15s; align-items:flex-start;
    border:1px solid transparent;
  }
  .item:hover{ background:#F6F9F8; border-color:var(--line); }
  .item.active{ background:var(--pulse-soft); border-color:#BFDBCF; }
  .item img.thumb{
    width:52px; height:52px; border-radius:9px; object-fit:cover;
    flex-shrink:0; border:1px solid var(--line); background:#eee;
    cursor:zoom-in;
  }
  .item .thumb.no-photo{
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:#fff;
    background:linear-gradient(135deg,var(--pulse-deep),var(--pulse));
    font-size:16px;
  }
  .item .info{ flex:1; min-width:0; }
  .item .name{
    font-weight:700; font-size:13.5px; line-height:1.3;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .item .meta{
    font-size:11.5px; color:var(--muted); margin-top:2px;
    font-family:var(--font-mono);
  }
  .item .patient{
    font-size:12px; color:var(--ink-soft); margin-top:3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .item .times{ margin-top:6px; display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
  .pill{
    display:inline-flex; align-items:center; gap:4px;
    font-size:10.5px; font-weight:700; padding:2px 8px;
    border-radius:20px; letter-spacing:0.02em;
    font-family:var(--font-mono);
  }
  .pill.in{ background:#E6F0EA; color:#1B4C37; }
  .pill.out{ background:#E8EEF6; color:#2E4A6E; }
  .pill.dur{ background:#FDF3E0; color:#8A5A1F; }
  .pill.miss{ background:var(--danger-soft); color:var(--danger); }
  .pill.type{ background:#F0F1F4; color:#4A5568; text-transform:uppercase; }
  .pill.date{ background:#EDE9F7; color:#4B3B7A; }

  /* ── Detail panel ───────────────── */
  .detail{
    position:fixed; bottom:0; left:0; right:0; z-index:900;
    background:#fff; border-radius:20px 20px 0 0;
    box-shadow:0 -10px 40px -12px rgba(20,28,43,0.35);
    transform:translateY(100%); transition:transform .3s ease;
    max-height:82vh; overflow-y:auto; max-width:620px; margin:0 auto;
  }
  .detail.open{ transform:translateY(0); }
  .detail .drag-bar{ width:44px; height:4px; border-radius:2px; background:var(--line); margin:10px auto 0; }
  .detail .d-head{ display:flex; gap:16px; padding:16px 20px 8px; align-items:center; }
  .detail .d-head img{
    width:84px; height:84px; border-radius:12px; object-fit:cover;
    border:1px solid var(--line); flex-shrink:0; background:#eee; cursor:zoom-in;
  }
  .detail .d-head .avatar{
    width:84px; height:84px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--pulse-deep),var(--pulse));
    color:#fff; font-weight:700; font-size:26px; flex-shrink:0;
  }
  .detail .d-head h2{ margin:0; font-size:18px; font-weight:700; line-height:1.25; }
  .detail .d-head .d-sub{ font-size:12.5px; color:var(--muted); margin-top:4px; font-family:var(--font-mono); }
  .detail .d-head .type-badge{
    display:inline-block; margin-top:6px; font-size:10.5px;
    font-weight:700; padding:2px 9px; border-radius:20px;
    background:#F0F1F4; color:#4A5568; text-transform:uppercase; letter-spacing:0.04em;
  }
  .detail .d-body{ padding:10px 20px 26px; }
  .detail .d-row{
    display:flex; justify-content:space-between; gap:14px; padding:10px 0;
    border-bottom:1px solid #E7ECEA; font-size:13.5px;
  }
  .detail .d-row:last-child{ border-bottom:none; }
  .detail .d-row .k{ color:var(--muted); font-weight:600; flex-shrink:0; }
  .detail .d-row .v{ text-align:right; word-break:break-word; }
  .detail .d-row .v a{ color:var(--pulse-deep); font-weight:700; }
  .detail .close-detail{
    position:absolute; top:12px; right:14px; background:none; border:none;
    font-size:24px; color:var(--muted); cursor:pointer; line-height:1; padding:4px 8px;
  }
  .detail-backdrop{
    position:fixed; inset:0; background:rgba(20,28,43,0.25); z-index:850;
    opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .detail-backdrop.show{ opacity:1; pointer-events:auto; }

  /* ── States ─────────────────────── */
  .state-msg{ padding:40px 24px; text-align:center; color:var(--muted); font-size:14px; }
  .state-msg b{ color:var(--ink); display:block; font-size:15px; margin-bottom:6px; }
  .spinner{
    width:32px; height:32px; border-radius:50%; border:3px solid var(--line);
    border-top-color:var(--pulse); margin:0 auto 16px; animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .errmsg{
    font-size:13px; color:var(--danger); padding:12px 16px;
    background:var(--danger-soft); border:1px solid #E3B4AB;
    border-radius:9px; margin:12px; line-height:1.6;
  }
  .errmsg code{ background:rgba(0,0,0,0.06); padding:1px 5px; border-radius:4px; font-size:12px; }
  .errmsg ol{ margin:6px 0 0; padding-left:20px; }

  /* ── Map markers ────────────────── */
  .map-pin{
    width:46px; height:46px; border-radius:50%; overflow:hidden;
    border:3px solid #fff; box-shadow:0 3px 10px rgba(20,28,43,0.4);
    background:#ddd; cursor:pointer; transition:transform .15s;
  }
  .map-pin:hover{ transform:scale(1.1); }
  .map-pin img{ width:100%; height:100%; object-fit:cover; display:block; }
  .map-pin.no-photo{
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:#fff;
    background:linear-gradient(135deg,var(--pulse-deep),var(--pulse));
    font-size:15px;
  }
  .map-pin.selected{
    border-color:var(--pulse);
    box-shadow:0 0 0 4px rgba(47,122,92,0.3),0 3px 10px rgba(20,28,43,0.4);
  }

  .lightbox{
    position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,0.9);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,0.5); }
  .lightbox .close-lb{
    position:absolute; top:20px; right:24px; background:none; border:none;
    color:#fff; font-size:36px; cursor:pointer; line-height:1;
  }

  @media (max-width:900px){
    .toolbar{ padding:10px 14px; gap:10px; }
    .brand h1{ font-size:15px; }
    .brand img.logo{ height:36px; min-width:36px; }
    .filters{ width:100%; }
    .filters label{ flex:1; min-width:120px; }
    .filters input, .filters select{ width:100%; }
  }
  @media (max-width:760px){
    .main{ flex-direction:column; }
    #map{ min-height:260px; flex:0 0 42vh; }
    .sidebar{ width:100%; flex:1; border-left:none; border-top:1px solid var(--line); }
    .detail{ max-width:100%; border-radius:16px 16px 0 0; }
  }
</style>
</head>
<body>

<!-- DEBUG BANNER — shows what's happening live -->
<div class="debug" id="debug"></div>

<div class="toolbar">
  <div class="brand">
    <img class="logo" id="brandLogo" src="" alt="Logo">
    <div class="divider"></div>
    <div>
      <h1>Attendance Map</h1>
      <div class="sub">Apollo Home Care — Nurses Daily Attendance</div>
    </div>
  </div>
  <div class="spacer"></div>

  <div class="filters">
    <label>From <input type="date" id="dateFrom"></label>
    <label>To <input type="date" id="dateTo"></label>
    <label>
      Staff Type
      <select id="staffTypeFilter" translate="no">
        <option value="">All types</option>
        <option value="Onroll">Onroll</option>
        <option value="AEN">AEN</option>
        <option value="Agency">Agency</option>
      </select>
    </label>
    <label>
      Status
      <select id="statusFilter" translate="no">
        <option value="">All</option>
        <option value="in">Signed in (open)</option>
        <option value="out">Signed out</option>
        <option value="missing">Missing sign-out</option>
      </select>
    </label>
    <label>Employee ID <input type="text" id="empIdSearch" placeholder="Search ID…" autocomplete="off" translate="no"></label>
    <button type="button" id="refreshBtn">Refresh</button>
    <button type="button" id="debugToggle" style="background:rgba(255,255,255,0.2);color:#fff;">Hide debug</button>
  </div>
</div>

<div class="main">
  <div id="map"></div>
  <div class="sidebar">
    <div class="sidebar-header">
      <span>Punches</span>
      <span class="count" id="punchCount">—</span>
    </div>
    <div class="list" id="list">
      <div class="state-msg"><div class="spinner"></div>Loading attendance…</div>
    </div>
  </div>
</div>

<div class="detail-backdrop" id="detailBackdrop"></div>
<div class="detail" id="detailPanel">
  <button type="button" class="close-detail" id="closeDetail" aria-label="Close">&times;</button>
  <div class="drag-bar"></div>
  <div id="detailContent"></div>
</div>

<div class="lightbox" id="lightbox">
  <button type="button" class="close-lb" id="closeLightbox" aria-label="Close">&times;</button>
  <img id="lightboxImg" alt="Full photo">
</div>

<script>
  /* ============================================================
     CONFIG — set these
     ============================================================ */
  const SUPABASE_URL      = 'https://pdgxpgvwgnptxdvffgos.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkZ3hwZ3Z3Z25wdHhkdmZmZ29zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwODE4NzQsImV4cCI6MjEwODY1Nzg3NH0.MT7IQIbwfLumBoUQ3PaXipoJti14z10rz8NBzqMMASo';

  const TABLE = 'attendance';

  /* Try multiple logo URLs in order; first one that loads wins.
     Replace each one with your real GitHub raw URL. */
  const LOGO_URLS = [
    'https://cdn.jsdelivr.net/gh/YOUR_GITHUB_USER/YOUR_REPO@main/logo.png',
    'https://raw.githubusercontent.com/YOUR_GITHUB_USER/YOUR_REPO/main/logo.png',
    ''  // empty = skip
  ];

  /* If you know your date column, set it. Leave blank to auto-detect among
     duty_date → date → sign_in_at → created_at → timestamp. */
  const DATE_COLUMN_OVERRIDE = '';

  /* Candidate date columns the code will auto-detect */
  const DATE_COLUMN_CANDIDATES = ['duty_date', 'date', 'sign_in_at', 'created_at', 'timestamp'];

  /* ============================================================
     Debug logger — writes to the black banner at the top
     ============================================================ */
  const debugEl = document.getElementById('debug');
  function log(level, ...parts){
    console.log('[' + level + ']', ...parts);
    const row = document.createElement('div');
    row.className = 'row';
    const tag = document.createElement('span');
    tag.className = 'tag ' + (level === 'ok' ? 'ok' : level === 'err' ? 'err' : 'info');
    tag.textContent = level.toUpperCase();
    const msg = document.createElement('span');
    msg.className = 'msg';
    msg.textContent = parts.map(p => typeof p === 'string' ? p : JSON.stringify(p)).join(' ');
    row.appendChild(tag); row.appendChild(msg);
    debugEl.appendChild(row);
    debugEl.scrollTop = debugEl.scrollHeight;
  }

  document.getElementById('debugToggle').addEventListener('click', (e) => {
    debugEl.classList.toggle('hidden');
    e.target.textContent = debugEl.classList.contains('hidden') ? 'Show debug' : 'Hide debug';
  });

  /* ============================================================
     State
     ============================================================ */
  let map = null;
  let markers = [];
  let allRows = [];
  let filteredRows = [];
  let mapReady = false;
  let selectedId = null;
  let L = null;
  let detectedDateColumn = null;

  const dateFrom        = document.getElementById('dateFrom');
  const dateTo          = document.getElementById('dateTo');
  const staffTypeFilter = document.getElementById('staffTypeFilter');
  const statusFilter    = document.getElementById('statusFilter');
  const empIdSearch     = document.getElementById('empIdSearch');
  const refreshBtn      = document.getElementById('refreshBtn');
  const listEl          = document.getElementById('list');
  const punchCountEl    = document.getElementById('punchCount');
  const detailPanel     = document.getElementById('detailPanel');
  const detailContent   = document.getElementById('detailContent');
  const detailBackdrop  = document.getElementById('detailBackdrop');
  const closeDetail     = document.getElementById('closeDetail');
  const lightbox        = document.getElementById('lightbox');
  const lightboxImg     = document.getElementById('lightboxImg');
  const closeLightbox   = document.getElementById('closeLightbox');
  const brandLogo       = document.getElementById('brandLogo');

  /* ── Load logo with multi-URL fallback + debug reporting ── */
  (function loadLogo(){
    const urls = LOGO_URLS.filter(u => u && u.trim());
    if (!urls.length){
      log('err', 'No LOGO_URLS configured — replace YOUR_GITHUB_USER / YOUR_REPO in the script.');
      brandLogo.style.display = 'none';
      return;
    }
    let i = 0;
    function tryNext(){
      if (i >= urls.length){
        log('err', 'All logo URLs failed. See Network tab. Last tried:', urls[urls.length-1]);
        brandLogo.style.display = 'none';
        return;
      }
      const url = urls[i++];
      log('info', 'Trying logo:', url);
      const probe = new Image();
      probe.crossOrigin = 'anonymous';
      probe.onload = () => {
        brandLogo.src = url;
        brandLogo.style.display = '';
        log('ok', 'Logo loaded:', url, '(' + probe.naturalWidth + '×' + probe.naturalHeight + ')');
      };
      probe.onerror = () => {
        log('err', 'Logo URL failed:', url);
        tryNext();
      };
      probe.src = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
    }
    tryNext();
  })();

  function localDateStr(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  const todayStr = localDateStr(new Date());
  dateFrom.value = todayStr;
  dateTo.value   = todayStr;

  /* ============================================================
     Helpers
     ============================================================ */
  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => (
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
    ));
  }
  function fmtTime(iso){
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  }
  function fmtDateTime(iso){
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }) +
      ' ' + d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  }
  function fmtDateShort(iso){
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short' });
  }
  function fmtDuration(ms){
    if (!isFinite(ms) || ms < 0) return '—';
    const totalMin = Math.round(ms / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return (h > 0 ? h + 'h ' : '') + m + 'm';
  }
  function initials(name){
    return String(name || '?').trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
  }
  function rowId(row){ return String(row.submission_id || row.id || row.employee_id || ''); }
  function durationOf(row){
    if (!row.sign_in_at || !row.sign_out_at) return null;
    const ms = new Date(row.sign_out_at).getTime() - new Date(row.sign_in_at).getTime();
    return isFinite(ms) && ms >= 0 ? ms : null;
  }

  /* ============================================================
     Raw REST wrapper — logs each request/response
     ============================================================ */
  async function restGet(path){
    const full = SUPABASE_URL + path;
    log('info', 'GET', path);
    const t0 = performance.now();
    let res;
    try {
      res = await fetch(full, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Accept': 'application/json',
          'Prefer': 'count=exact'
        }
      });
    } catch (netErr){
      log('err', 'Network error:', netErr.message);
      throw netErr;
    }
    const ms = Math.round(performance.now() - t0);
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }

    const countHeader = res.headers.get('content-range');
    if (!res.ok){
      const msg = (data && (data.message || data.hint || data.error)) || ('HTTP ' + res.status);
      log('err', 'HTTP', res.status, 'in', ms + 'ms →', msg);
      const err = new Error(msg); err.status = res.status; throw err;
    }
    const n = Array.isArray(data) ? data.length : 0;
    log('ok', 'HTTP', res.status, 'in', ms + 'ms →', n, 'row(s)', countHeader ? '[' + countHeader + ']' : '');
    return data;
  }

  /* ============================================================
     Auto-detect date column by probing one row
     ============================================================ */
  async function detectDateColumn(){
    if (DATE_COLUMN_OVERRIDE){
      detectedDateColumn = DATE_COLUMN_OVERRIDE;
      log('ok', 'Date column (override):', detectedDateColumn);
      return detectedDateColumn;
    }
    /* Probe with a single row to inspect columns */
    let probeRows;
    try {
      probeRows = await restGet('/rest/v1/' + TABLE + '?select=*&limit=1');
    } catch (e){
      log('err', 'Probe failed — cannot read ' + TABLE + '. See RLS check below.');
      throw e;
    }
    if (!Array.isArray(probeRows) || !probeRows.length){
      log('err', 'Table ' + TABLE + ' returned 0 rows. It exists and RLS allows SELECT, but there is no data.');
      throw new Error('Table is empty. Submit at least one attendance to test.');
    }
    const cols = Object.keys(probeRows[0]);
    log('ok', 'Table columns:', cols.join(', '));

    for (const cand of DATE_COLUMN_CANDIDATES){
      if (cols.includes(cand)){
        detectedDateColumn = cand;
        log('ok', 'Auto-detected date column:', cand, '(value sample:', String(probeRows[0][cand]), ')');
        return cand;
      }
    }
    log('err', 'No date column found. Expected one of:', DATE_COLUMN_CANDIDATES.join(', '));
    throw new Error('No usable date column in ' + TABLE);
  }

  /* ============================================================
     Fetch with the detected date column
     ============================================================ */
  async function fetchAttendance(fromStr, toStr){
    if (!detectedDateColumn){
      await detectDateColumn();
    }
    const col = detectedDateColumn;
    let path, rows;

    /* For `date` columns: direct gte/lte strings work perfectly */
    if (col === 'duty_date' || col === 'date'){
      path = '/rest/v1/' + TABLE +
        '?select=*' +
        '&' + col + '=gte.' + encodeURIComponent(fromStr) +
        '&' + col + '=lte.' + encodeURIComponent(toStr) +
        '&order=' + col + '.desc';
      rows = await restGet(path);
      return Array.isArray(rows) ? rows : [];
    }

    /* For timestamp columns: widen ±1 day then re-filter by local date */
    const from = new Date(fromStr + 'T00:00:00'); from.setDate(from.getDate() - 1);
    const to   = new Date(toStr   + 'T23:59:59.999'); to.setDate(to.getDate() + 1);
    path = '/rest/v1/' + TABLE +
      '?select=*' +
      '&' + col + '=gte.' + encodeURIComponent(from.toISOString()) +
      '&' + col + '=lte.' + encodeURIComponent(to.toISOString()) +
      '&order=' + col + '.desc';
    rows = await restGet(path);
    const before = rows.length;
    rows = rows.filter(r => {
      const raw = r[col];
      if (!raw) return true;
      const local = localDateStr(new Date(raw));
      return local >= fromStr && local <= toStr;
    });
    log('info', 'Local-date re-filter:', before, '→', rows.length);
    return rows;
  }

  /* ============================================================
     Filters
     ============================================================ */
  function applyFilters(){
    const type   = staffTypeFilter.value;
    const status = statusFilter.value;
    const idQ    = empIdSearch.value.trim().toLowerCase();

    filteredRows = allRows.filter(r => {
      if (type && String(r.emp_type || '').toLowerCase() !== type.toLowerCase()) return false;
      if (status === 'in'  && r.sign_out_at) return false;
      if (status === 'out' && !r.sign_out_at) return false;
      if (idQ) {
        const hay = (String(r.employee_id || '') + ' ' + String(r.nurse_name || '')).toLowerCase();
        if (!hay.includes(idQ)) return false;
      }
      return true;
    });

    renderList();
    plotAll();
  }

  /* ============================================================
     Map bootstrap
     ============================================================ */
  function loadScript(src){
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function initMap(){
    log('info', 'Initialising map (Leaflet / OpenStreetMap)…');
    try {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
      document.head.appendChild(link);
      await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
      L = window.L;
      if (!L) throw new Error('Leaflet global not defined');
      map = L.map('map', { zoomControl: true }).setView([20.5937, 78.9629], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
      mapReady = true;
      log('ok', 'Map ready');
    } catch (e) {
      log('err', 'Map init failed:', e.message);
    }
  }

  /* ============================================================
     Markers
     ============================================================ */
  function clearMarkers(){
    if (L && map) markers.forEach(m => map.removeLayer(m));
    markers = [];
  }

  function plotAll(){
    if (!mapReady || !L) return;
    clearMarkers();
    const withCoords = filteredRows.filter(r =>
      r.latitude != null && r.longitude != null &&
      isFinite(Number(r.latitude)) && isFinite(Number(r.longitude))
    );
    log('info', 'Plottable rows:', withCoords.length, 'of', filteredRows.length);
    if (!withCoords.length) return;

    withCoords.forEach(row => addMarker(row));

    const bounds = withCoords.map(r => [Number(r.latitude), Number(r.longitude)]);
    if (withCoords.length === 1) map.setView(bounds[0], 14);
    else map.fitBounds(bounds, { padding: [40, 40] });
  }

  function addMarker(row){
    const lat = Number(row.latitude);
    const lng = Number(row.longitude);
    const hasPhoto = !!row.photo_base64;
    const init = initials(row.nurse_name);
    const id = rowId(row);
    const iconHtml = hasPhoto
      ? `<div class="map-pin" data-id="${escapeHtml(id)}"><img src="${row.photo_base64}" alt=""></div>`
      : `<div class="map-pin no-photo" data-id="${escapeHtml(id)}">${escapeHtml(init)}</div>`;
    const icon = L.divIcon({ html: iconHtml, className: '', iconSize: [46, 46], iconAnchor: [23, 23] });
    const marker = L.marker([lat, lng], { icon }).addTo(map);
    marker.on('click', () => selectRow(row));
    marker._row = row;
    markers.push(marker);
  }

  /* ============================================================
     Sidebar list
     ============================================================ */
  function renderList(){
    if (!filteredRows.length) {
      listEl.innerHTML = '<div class="state-msg"><b>No matching attendance</b>Try a wider date range or clear filters.</div>';
      punchCountEl.textContent = '0';
      return;
    }
    punchCountEl.textContent = String(filteredRows.length);

    const multiDay = dateFrom.value && dateTo.value && dateFrom.value !== dateTo.value;

    listEl.innerHTML = filteredRows.map(row => {
      const id = rowId(row);
      const hasPhoto = !!row.photo_base64;
      const thumb = hasPhoto
        ? `<img class="thumb" src="${row.photo_base64}" alt="" data-photo="${escapeHtml(row.photo_base64)}">`
        : `<div class="thumb no-photo">${escapeHtml(initials(row.nurse_name))}</div>`;
      const durMs = durationOf(row);
      const durStr = durMs != null ? fmtDuration(durMs) : null;
      const datePill = multiDay ? `<span class="pill date">${escapeHtml(fmtDateShort(row[detectedDateColumn] || row.sign_in_at))}</span>` : '';
      const timesHtml =
        `<span class="pill in">IN ${escapeHtml(fmtTime(row.sign_in_at))}</span>` +
        (row.sign_out_at
          ? `<span class="pill out">OUT ${escapeHtml(fmtTime(row.sign_out_at))}</span>` +
            (durStr ? `<span class="pill dur">${escapeHtml(durStr)}</span>` : '')
          : `<span class="pill miss">Missing sign-out</span>`);
      const typeBadge = row.emp_type ? `<span class="pill type">${escapeHtml(row.emp_type)}</span>` : '';
      return `
        <div class="item${selectedId === id ? ' active' : ''}" data-id="${escapeHtml(id)}">
          ${thumb}
          <div class="info">
            <div class="name">${escapeHtml(row.nurse_name || '—')}</div>
            <div class="meta">${escapeHtml(row.employee_id || '')}${row.care_centre ? ' · ' + escapeHtml(row.care_centre) : ''}</div>
            <div class="patient">👤 ${escapeHtml(row.patient_name || 'No patient')}</div>
            <div class="times">${datePill}${timesHtml}${typeBadge}</div>
          </div>
        </div>`;
    }).join('');

    listEl.querySelectorAll('.item').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.classList.contains('thumb') && e.target.dataset.photo) {
          openLightbox(e.target.dataset.photo); return;
        }
        const row = filteredRows.find(r => rowId(r) === el.dataset.id);
        if (row) selectRow(row);
      });
    });
  }

  /* ============================================================
     Selection & detail
     ============================================================ */
  function selectRow(row){
    selectedId = rowId(row);
    listEl.querySelectorAll('.item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === selectedId);
    });
    if (mapReady && L && row.latitude != null && row.longitude != null) {
      map.setView([Number(row.latitude), Number(row.longitude)], Math.max(map.getZoom(), 14), { animate: true });
    }
    markers.forEach(m => {
      const pin = m.getElement && m.getElement().querySelector('.map-pin');
      if (pin) pin.classList.toggle('selected', rowId(m._row || {}) === selectedId);
    });
    showDetail(row);
  }

  function showDetail(row){
    const hasPhoto = !!row.photo_base64;
    const photoHtml = hasPhoto
      ? `<img src="${row.photo_base64}" alt="Verification photo" data-photo="${escapeHtml(row.photo_base64)}">`
      : `<div class="avatar">${escapeHtml(initials(row.nurse_name))}</div>`;
    const durMs = durationOf(row);
    const durStr = durMs != null ? fmtDuration(durMs) : '—';
    const mapLink = (row.latitude != null && row.longitude != null)
      ? `<a href="https://maps.google.com/?q=${Number(row.latitude)},${Number(row.longitude)}" target="_blank" rel="noopener">Open in Maps ↗</a>`
      : '—';
    const typeBadge = row.emp_type ? `<span class="type-badge">${escapeHtml(row.emp_type)}</span>` : '';

    detailContent.innerHTML = `
      <div class="d-head">
        ${photoHtml}
        <div>
          <h2>${escapeHtml(row.nurse_name || '—')}</h2>
          <div class="d-sub">${escapeHtml(row.employee_id || '')} · ${escapeHtml(row.care_centre || '')}</div>
          ${typeBadge}
        </div>
      </div>
      <div class="d-body">
        <div class="d-row"><span class="k">Patient</span><span class="v">${escapeHtml(row.patient_name || '—')}</span></div>
        <div class="d-row"><span class="k">Signed in</span><span class="v">${escapeHtml(fmtDateTime(row.sign_in_at))}</span></div>
        <div class="d-row"><span class="k">Signed out</span><span class="v">${escapeHtml(row.sign_out_at ? fmtDateTime(row.sign_out_at) : 'Still open')}</span></div>
        <div class="d-row"><span class="k">Duration</span><span class="v">${escapeHtml(durStr)}</span></div>
        <div class="d-row"><span class="k">Sign-in location</span><span class="v">${escapeHtml(row.location_text || '—')}</span></div>
        <div class="d-row"><span class="k">GPS</span><span class="v">${row.latitude != null ? Number(row.latitude).toFixed(5) + ', ' + Number(row.longitude).toFixed(5) : '—'}<br>${mapLink}</span></div>
        <div class="d-row"><span class="k">Accuracy</span><span class="v">${row.accuracy_meters != null ? escapeHtml(row.accuracy_meters) + ' m' : '—'}</span></div>
        <div class="d-row"><span class="k">Remarks</span><span class="v">${escapeHtml(row.remarks || '—')}</span></div>
      </div>`;

    const img = detailContent.querySelector('img[data-photo]');
    if (img) img.addEventListener('click', () => openLightbox(img.dataset.photo));

    detailPanel.classList.add('open');
    detailBackdrop.classList.add('show');
  }

  function closeDetailPanel(){
    detailPanel.classList.remove('open');
    detailBackdrop.classList.remove('show');
    selectedId = null;
    listEl.querySelectorAll('.item.active').forEach(el => el.classList.remove('active'));
    markers.forEach(m => {
      const pin = m.getElement && m.getElement().querySelector('.map-pin');
      if (pin) pin.classList.remove('selected');
    });
  }
  closeDetail.addEventListener('click', closeDetailPanel);
  detailBackdrop.addEventListener('click', closeDetailPanel);

  function openLightbox(src){ lightboxImg.src = src; lightbox.classList.add('open'); }
  closeLightbox.addEventListener('click', () => lightbox.classList.remove('open'));
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('open'); });

  /* ============================================================
     Load
     ============================================================ */
  async function loadData(){
    let fromStr = dateFrom.value || todayStr;
    let toStr   = dateTo.value   || todayStr;
    if (fromStr > toStr) { const t = fromStr; fromStr = toStr; toStr = t; dateFrom.value = fromStr; dateTo.value = toStr; }

    log('info', '──── Load start: ' + fromStr + ' → ' + toStr + ' ────');
    listEl.innerHTML = '<div class="state-msg"><div class="spinner"></div>Loading attendance…</div>';
    punchCountEl.textContent = '—';
    refreshBtn.disabled = true;

    try {
      const rows = await fetchAttendance(fromStr, toStr);
      allRows = Array.isArray(rows) ? rows : [];
      log('ok', 'Total rows loaded:', allRows.length);
      if (allRows.length && allRows[0]){
        log('info', 'First row keys:', Object.keys(allRows[0]).join(', '));
      }
      applyFilters();
      if (!allRows.length){
        log('err', 'No rows in this date range. Try a wider "From/To", or check the ' + detectedDateColumn + ' value of your test row.');
      }
    } catch (err) {
      log('err', 'Load failed:', err.message);
      listEl.innerHTML = `<div class="errmsg">
        <b>Could not load attendance.</b><br>
        ${escapeHtml(err.message || 'Unknown error')}
        <ol>
          <li>Open Supabase → <b>Table Editor → ${escapeHtml(TABLE)}</b>. Does the table exist and does it have data?</li>
          <li>Check <b>Authentication → Policies</b>. You need <code>SELECT</code> for the <code>anon</code> role (or turn RLS off temporarily).</li>
          <li>Look at the <b>debug banner at the top</b> for the exact HTTP error.</li>
        </ol>
      </div>`;
      punchCountEl.textContent = '0';
    } finally {
      refreshBtn.disabled = false;
    }
  }

  refreshBtn.addEventListener('click', loadData);
  dateFrom.addEventListener('change', loadData);
  dateTo.addEventListener('change', loadData);
  staffTypeFilter.addEventListener('change', applyFilters);
  statusFilter.addEventListener('change', applyFilters);

  let searchTimer = null;
  empIdSearch.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilters, 200);
  });

  (async function init(){
    log('info', 'App starting');
    await initMap();
    await loadData();
  })();
</script>
</body>
